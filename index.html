<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunflower Land — Guides</title>
    <style>
        :root {
            color-scheme: dark;
            --bg-body: #0f1117;
            --bg-surface: #1a1d24;
            --bg-hover: #262b36;
            --border: #2e3340;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-fish: #38bdf8;
            --accent-flower: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-body);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            padding: 24px;
        }

        main { width: 100%; max-width: 560px; }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 4px;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .cards {
            display: grid;
            gap: 16px;
        }

        a.card {
            display: block;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
            text-decoration: none;
            color: inherit;
            transition: background 0.15s, transform 0.15s;
        }

        a.card:hover {
            background: var(--bg-hover);
            transform: translateY(-2px);
        }

        .card h2 {
            font-size: 1.15rem;
            margin-bottom: 4px;
        }

        .card.fish h2 { color: var(--accent-fish); }
        .card.flower h2 { color: var(--accent-flower); }

        .card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <main>
        <h1>Sunflower Land — Guides</h1>
        <p class="subtitle">Pick which guide you want to open:</p>
        <nav class="cards">
            <a class="card fish" href="fish/">
                <h2>🐟 Fishing Guide</h2>
                <p>Fish inventory and filters.</p>
            </a>
            <a class="card flower" href="flower/">
                <h2>🌸 Flowers &amp; Crossbreeding Guide</h2>
                <p>Crossbreeds and flower combinations.</p>
            </a>
        </nav>
    </main>
</body>
</html>
