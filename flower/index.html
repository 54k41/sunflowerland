<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Guide & Crossbreeding</title>
    <script>
        // Applies the theme before first paint: with no saved preference, follows the
        // system's prefers-color-scheme. Avoids the dark-theme flash on a light-mode OS.
        (function () {
            try {
                var saved = localStorage.getItem('flowerGuideTheme');
                var prefersLight = window.matchMedia
                    && window.matchMedia('(prefers-color-scheme: light)').matches;
                document.documentElement.setAttribute(
                    'data-theme',
                    (saved === 'light' || saved === 'dark') ? saved : (prefersLight ? 'light' : 'dark')
                );
            } catch (err) {
                /* No access to localStorage: keeps the theme declared on <html>. */
            }
        })();
    </script>
    <style>
        /* =========================================
           1. VARIABLES & THEMES (Design Tokens)
           ========================================= */
        :root {
            color-scheme: dark;
            --accent: #10b981;
            --accent-hover: #059669;
            --accent-muted: rgba(16, 185, 129, 0.15);
            --bg-body: #0f1117;
            --bg-surface: #1a1d24;
            --bg-surface-elevated: #222630;
            --bg-hover: #262b36;
            --border: #2e3340;
            --border-focus: #3b82f6;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --best-bg: rgba(254, 240, 138, 0.1);
            --best-border: rgba(250, 204, 21, 0.3);
            --best-text: #fde047;
            --best-arrow: #ca8a04;
            --danger: #ef4444;
            --danger-muted: rgba(239, 68, 68, 0.15);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
        }

        [data-theme="light"] {
            color-scheme: light;
            --accent: #059669;
            --accent-hover: #047857;
            --accent-muted: rgba(5, 150, 105, 0.12);
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --bg-surface-elevated: #f1f5f9;
            --bg-hover: #e2e8f0;
            --border: #e2e8f0;
            --border-focus: #2563eb;
            --text-primary: #0f172a;
            /* Contrast over #ffffff: secondary 7.6:1 and muted 4.8:1 — both pass
               WCAG AA (4.5:1) for small text. The previous value (#94a3b8) sat at ~2.6:1. */
            --text-secondary: #475569;
            --text-muted: #64748b;
            --best-bg: #fef9c3;
            --best-border: #fef08a;
            --best-text: #854d0e;
            --best-arrow: #a16207;
            --danger: #dc2626;
            --danger-muted: rgba(220, 38, 38, 0.1);
        }

        /* =========================================
           2. BASE & ACCESSIBILITY
           ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            padding: 24px 16px 80px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.2s, color 0.2s;
        }

        :focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 2px;
        }

        .container {
            max-width: 720px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 4px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 6px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--text-primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .save-indicator {
            font-size: 0.75rem;
            color: var(--accent);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            font-weight: 500;
        }

        .save-indicator.visible {
            opacity: 1;
            visibility: visible;
        }

        /* Persistent warning: the view was updated, but nothing was written to the browser. */
        .save-warning {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            background: var(--danger-muted);
            border: 1px solid var(--danger);
            color: var(--danger);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            font-size: 0.8rem;
            font-weight: 500;
            line-height: 1.4;
        }

        .save-warning-icon {
            line-height: 1.2;
            flex-shrink: 0;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            transition: background 0.15s, border-color 0.15s;
        }

        .icon-btn:hover {
            background: var(--bg-surface-elevated);
            border-color: var(--text-secondary);
        }

        /* =========================================
           3. FILTERS, SEARCH & SORTING
           ========================================= */
        .controls-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-bar {
            width: 100%;
            background: var(--bg-body);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.88rem;
        }

        .search-bar:focus {
            border-color: var(--accent);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-label {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .chip-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .chip {
            background: var(--bg-body);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 5px 10px;
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .chip:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        .chip.active {
            background: var(--accent-muted);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
        }

        .toolbar-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding-top: 6px;
            border-top: 1px solid var(--border);
        }

        .sort-select {
            background: var(--bg-body);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 0.78rem;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
        }

        .btn-clear {
            background: transparent;
            border: 1px dashed var(--border);
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 5px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-clear:hover {
            border-color: var(--danger);
            color: var(--danger);
            background: var(--danger-muted);
        }

        /* =========================================
           4. GLOBAL & FILTERED PROGRESS
           ========================================= */
        .progress-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .progress-subtext {
            font-size: 0.74rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .progress-bar {
            height: 6px;
            background: var(--border);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* =========================================
           5. FLOWER CARDS
           ========================================= */
        .flower-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 12px;
        }

        .flower-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            transition: border-color 0.15s, background-color 0.15s;
        }

        .flower-card:hover {
            border-color: var(--text-muted);
            background: var(--bg-hover);
        }

        .flower-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }

        .flower-title-box {
            display: flex;
            flex-direction: column;
        }

        .flower-name {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .flower-badge-row {
            display: flex;
            gap: 4px;
            margin-top: 2px;
        }

        .tag {
            font-size: 0.68rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--bg-body);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .checkbox-btn {
            background: var(--bg-body);
            border: 1.5px solid var(--border);
            width: 26px;
            height: 26px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: #ffffff;
            flex-shrink: 0;
            transition: all 0.15s ease;
        }

        .checkbox-btn:hover {
            border-color: var(--accent);
        }

        /* The icon always lives in the DOM, but it is only rendered when the state is
           "checked". Using display:none (instead of color:transparent) prevents screen
           readers and Windows high-contrast mode (forced-colors) from forcing the color
           and exposing a fake "✓" on unchecked buttons. */
        .check-icon {
            display: none;
            line-height: 1;
        }

        .checkbox-btn[aria-checked="true"] {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        .checkbox-btn[aria-checked="true"] .check-icon {
            display: inline-block;
        }

        @media (forced-colors: active) {
            .checkbox-btn[aria-checked="true"] {
                background: Highlight;
                border-color: Highlight;
                color: HighlightText;
            }
        }

        /* Collected cards keep AA contrast: instead of reducing the opacity of the
           whole card (which dropped text to ~2.5:1), a dashed border and secondary
           text are used — visually distinct, but readable. */
        .flower-card.collected {
            border-style: dashed;
            background: var(--bg-surface);
        }

        .flower-card.collected .flower-name {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .recipe-box {
            border-top: 1px dashed var(--border);
            padding-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .recipe-header {
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .recipe-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 0.72rem;
            color: var(--text-secondary);
        }

        .recipe-list li {
            line-height: 1.3;
            word-break: break-word;
        }

        .expand-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            padding: 2px 0;
        }

        .expand-btn:hover {
            text-decoration: underline;
        }

        .best-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 0.72rem;
            font-weight: 600;
            padding: 5px 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            transition: all 0.15s;
        }

        .best-btn:hover {
            border-color: var(--text-secondary);
        }

        .best-btn .arrow-icon {
            font-size: 0.65rem;
            transition: transform 0.2s ease;
        }

        .best-btn[aria-expanded="true"] .arrow-icon {
            transform: rotate(180deg);
        }

        .best-path {
            display: none;
            background: var(--best-bg);
            border: 1px solid var(--best-border);
            color: var(--best-text);
            border-radius: var(--radius-sm);
            padding: 8px;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
            font-size: 0.72rem;
            font-weight: 500;
        }

        .best-path.open {
            display: flex;
        }

        .path-step {
            text-align: center;
            width: 100%;
            word-break: break-word;
        }

        .path-arrow {
            font-size: 0.7rem;
            color: var(--best-arrow);
            line-height: 1;
        }

        .section-label {
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin: 12px 0 6px;
        }

        .empty-message {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.88rem;
            padding: 36px 16px;
            background: var(--bg-surface);
            border: 1px dashed var(--border);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* =========================================
           6. TOAST & UNDO FEEDBACK
           ========================================= */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-surface-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border-radius: var(--radius-md);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.82rem;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s ease, visibility 0.25s ease;
            pointer-events: none;
            /* Never exceeds the viewport: long messages + the undo button
               broke the layout on 360px screens (iPhone SE) with horizontal scroll. */
            width: max-content;
            max-width: min(560px, calc(100vw - 32px));
            flex-wrap: wrap;
        }

        .toast-text {
            flex: 1 1 200px;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .toast-undo-btn {
            background: var(--accent-muted);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            flex: 0 0 auto;
            white-space: nowrap;
        }

        .toast-undo-btn:hover {
            background: var(--accent);
            color: #ffffff;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <a class="back-link" href="../">← All guides</a>
                <h1>Flower Guide</h1>
            </div>
            <div class="header-actions">
                <span id="saveIndicator" class="save-indicator" aria-live="polite">☁ Saved</span>
                <button type="button" id="resetBtn" class="icon-btn" title="Reset collection progress" aria-label="Reset collection progress">↺</button>
                <button type="button" id="themeToggle" class="icon-btn" aria-label="Toggle theme">☀️</button>
            </div>
        </header>

        <div id="saveWarning" class="save-warning hidden" role="alert" aria-live="assertive" data-kind="">
            <span class="save-warning-icon" aria-hidden="true">⚠</span>
            <span data-warning-text>Persistence unavailable — the browser blocked local storage. Nothing you check will be saved.</span>
        </div>

        <section class="controls-card" role="search" aria-label="Filter and search panel">
            <input type="search" id="searchInput" class="search-bar" placeholder="Search by flower, seed, ingredient or family..." aria-label="Search field" />

            <div class="filter-group">
                <span class="filter-label" id="seedFilterLabel">Base Seed</span>
                <div class="chip-row" id="seedChips" role="group" aria-labelledby="seedFilterLabel">
                    <button type="button" class="chip active" data-val="" aria-pressed="true">All</button>
                    <button type="button" class="chip" data-val="Sunpetal Seed (1 Day)" aria-pressed="false">Sunpetal (1d)</button>
                    <button type="button" class="chip" data-val="Bloom Seed (2 Days)" aria-pressed="false">Bloom (2d)</button>
                    <button type="button" class="chip" data-val="Lily Seed (5 Days)" aria-pressed="false">Lily (5d)</button>
                </div>
            </div>

            <div class="filter-group">
                <span class="filter-label" id="typeFilterLabel">Family / Species</span>
                <div class="chip-row" id="typeChips" role="group" aria-labelledby="typeFilterLabel">
                    <button type="button" class="chip active" data-val="" aria-pressed="true">All</button>
                    <button type="button" class="chip" data-val="Pansy" aria-pressed="false">Pansy</button>
                    <button type="button" class="chip" data-val="Cosmos" aria-pressed="false">Cosmos</button>
                    <button type="button" class="chip" data-val="Balloon Flower" aria-pressed="false">Balloon</button>
                    <button type="button" class="chip" data-val="Daffodil" aria-pressed="false">Daffodil</button>
                    <button type="button" class="chip" data-val="Carnation" aria-pressed="false">Carnation</button>
                    <button type="button" class="chip" data-val="Lotus" aria-pressed="false">Lotus</button>
                    <button type="button" class="chip" data-val="Special" aria-pressed="false">Special</button>
                </div>
            </div>

            <div class="toolbar-row">
                <label style="display:flex; align-items:center; gap: 6px; font-size:0.75rem; color:var(--text-secondary);">
                    Sort:
                    <select id="sortSelect" class="sort-select" aria-label="Sort flowers by">
                        <option value="default">Database order</option>
                        <option value="name-asc">Name (A - Z)</option>
                        <option value="name-desc">Name (Z - A)</option>
                        <option value="recipes-desc">Most crossbreeds</option>
                    </select>
                </label>

                <button type="button" id="clearFiltersBtn" class="btn-clear hidden">× Clear filters</button>
            </div>
        </section>

        <section class="progress-card" aria-label="Collection progress">
            <div class="progress-header">
                <span>Overall Progress: <strong id="globalProgressLabel">Loading...</strong></span>
                <span id="globalRemainingLabel" class="progress-subtext"></span>
            </div>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <div id="filterProgressSubtext" class="progress-subtext hidden"></div>
        </section>

        <main id="flowerListContainer">
            <div id="missingSection">
                <div class="section-label" id="missingLabel">Pending</div>
                <div id="missingGrid" class="flower-grid"></div>
            </div>

            <div id="collectedSection" class="hidden">
                <div class="section-label" id="collectedLabel">Grown</div>
                <div id="collectedGrid" class="flower-grid"></div>
            </div>

            <div id="emptyState" class="empty-message hidden">
                <p id="emptyStateMessage">No flowers found for the applied filters.</p>
                <button type="button" id="emptyClearBtn" class="btn-clear">Clear filters and search</button>
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="status" aria-live="polite">
        <span id="toastText" class="toast-text"></span>
        <button type="button" id="toastUndoBtn" class="toast-undo-btn hidden">Undo last change</button>
    </div>

    <script>
        /* =========================================
           7. DATABASE & VALIDATION WITH PRECOMPUTED SEARCH
           ========================================= */
        const rawFlowerDatabase = [
            {

            },
            {
                id: "sun_blue_pansy",
                name: "Blue Pansy",
                type: "Pansy",
                seed: "Sunpetal Seed (1 Day)",
                bestTime: "2d",
                bestSteps: ["(1d) Purple Cosmos", "(1d) Blue Pansy"],
                recipes: ["(1d) Purple Cosmos", "(1d) White Pansy", "(1d) White Cosmos", "(2d) White Daffodil", "(2d) Blue Daffodil", "(5d) White Carnation"]
            },
            {
                id: "sun_red_cosmos",
                name: "Red Cosmos",
                type: "Cosmos",
