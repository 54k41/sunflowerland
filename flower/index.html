        function validateAndNormalizeDatabase(rawList) {
            const seenIds = new Set();
            const cleanList = [];

            rawList.forEach((item, index) => {
                if (!item || typeof item !== 'object') return;
                const safeId = String(item.id || `flower_${index}`).trim();

                if (seenIds.has(safeId)) {
                    console.error(`Duplicate ID detected: "${safeId}". Ignored.`);
                    return;
                }
                seenIds.add(safeId);

                const name = String(item.name || 'Unnamed');
                const type = String(item.type || 'General');
                const seed = String(item.seed || 'Unknown');
                const bestTime = item.bestTime ? String(item.bestTime) : null;
                const bestSteps = Array.isArray(item.bestSteps) ? item.bestSteps.map(String) : [];
                const recipes = Array.isArray(item.recipes) ? item.recipes.map(String) : [];

                // PT-BR aliases for search: the internal type "Special" used to be shown as
                // "Especial" in the chip; without the alias, searching "especial" found nothing.
                // The database has 33 flowers, 11 without bestTime (no optimized route data —
                // expected behavior: the card simply omits the "Best route" button).
                const typeAliases = type === 'Special' ? 'especial especiais' : '';
                // Precomputes the lowercase search string
                const searchText = `${name} ${seed} ${type} ${typeAliases} ${recipes.join(' ')} ${bestSteps.join(' ')}`.toLowerCase();

                cleanList.push({
                    id: safeId,
                    name,
                    type,
                    seed,
                    bestTime,
                    bestSteps,
                    recipes,
                    searchText
                });
            });

            return cleanList;
        }

        const flowerDatabase = validateAndNormalizeDatabase(rawFlowerDatabase);

        /* =========================================
           8. STORAGE & IN-MEMORY APP STATE
           ========================================= */
        const STORAGE_KEY = 'flowerGuideInventory_v3';
        const LEGACY_STORAGE_KEY = 'flowerGuideInventory_v2';
        const THEME_KEY = 'flowerGuideTheme';

        const isPlainObject = (value) => !!value && typeof value === 'object' && !Array.isArray(value);

        function normalizeInventory(raw) {
            if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return {};

            const validIds = new Set(flowerDatabase.map(f => f.id));
            const normalized = {};

            Object.entries(raw).forEach(([id, value]) => {
                // Only accepts values that represent "collected". Current writes always
                // store `true`, but legacy/future data may carry 1 or "true".
                // Any other format (0, "false", objects...) is discarded.
                if (validIds.has(id) && (value === true || value === 1 || value === 'true')) {
                    normalized[id] = true;
                }
            });

            return normalized;
        }

        // Removes the legacy (v2) key without ever breaking boot: storage may be
        // blocked (e.g. private mode) and throw an exception.
        function clearLegacyStorage() {
            try {
                localStorage.removeItem(LEGACY_STORAGE_KEY);
            } catch (err) {
                console.warn('Could not remove the legacy storage key:', err);
            }
        }

        // Reads and interprets ONE inventory version in isolation.
        // A failure here (blocked storage or invalid JSON) does not prevent trying the other versions.
        function readInventoryVersion(key, { unwrapCollected }) {
            let raw = null;
            try {
                raw = localStorage.getItem(key);
            } catch (err) {
                markStorageBlocked(err);
                return { status: 'blocked' };
            }
            if (!raw) return { status: 'empty' };

            let parsed;
            try {
                parsed = JSON.parse(raw);
            } catch (err) {
                console.error(`Invalid JSON in "${key}". Version ignored, moving on to the previous one:`, err);
                return { status: 'corrupt' };
            }

            // The v3 payload stores `version: 3`. If the current key carries another version
            // (e.g. a future v4), do NOT interpret it as v3 and do NOT treat it as ordinary
            // corruption: return 'unsupported' so the caller never falls back to v2 or
            // rewrites over a newer format.
            if (key === STORAGE_KEY && isPlainObject(parsed)
                && 'version' in parsed && parsed.version !== 3) {
                console.warn(`Unsupported version in "${key}" (version=${parsed.version}). Read refused to avoid destroying the format.`);
                return { status: 'unsupported', version: parsed.version };
            }

            let candidate;
            if (unwrapCollected) {
                candidate = isPlainObject(parsed) && isPlainObject(parsed.collected) ? parsed.collected : null;
            } else {
                // Old format: may be { collected: {...} } or the direct map.
                candidate = isPlainObject(parsed) && isPlainObject(parsed.collected) ? parsed.collected : parsed;
            }

            if (!isPlainObject(candidate)) return { status: 'corrupt' };

            const inventory = normalizeInventory(candidate);
            return {
                status: 'ok',
                inventory,
                needsRewrite: JSON.stringify(inventory) !== JSON.stringify(candidate),
                rev: isPlainObject(parsed) && typeof parsed.rev === 'string' ? parsed.rev : null
            };
        }

        // Current persisted version + stamp (rev) used for concurrency control.
        function readCurrentSnapshot() {
            const result = readInventoryVersion(STORAGE_KEY, { unwrapCollected: true });
            if (result.status === 'ok') return { inventory: result.inventory, rev: result.rev };
            if (result.status === 'empty') return { inventory: {}, rev: null };
            if (result.status === 'unsupported') return null; // future format: exists, but cannot serve as a base
            return null; // corrupted or blocked: cannot serve as a base
        }

        // `rewrite: false` is used when syncing with another tab: a storage listener
        // must not write, or echoes would bounce between tabs.
        function loadInventoryFromStorage({ rewrite = true } = {}) {
            // Revalidates a stale 'unsupported' flag: if the current key no longer
            // contains a future format, the session allows writes again. Without this,
            // a later valid v3 never re-enabled saves.
            if (storageState.unsupported && !storedVersionIsUnsupported()) {
                storageState.unsupported = false;
                if (storageState.warningKind === 'unsupported') setStorageWarning(null);
            }
            // Current version first...
            const current = readInventoryVersion(STORAGE_KEY, { unwrapCollected: true });

            // Future format (e.g. version 4): never falls back to v2 and never
            // rewrites. Either action would destroy data from a newer version of
            // the app. The session continues with an empty in-memory collection, with a warning.
            if (current.status === 'unsupported') {
                storageState.unsupported = true;
                if (storageState.available !== false) setStorageWarning('unsupported');
                return {};
            }

            if (current.status === 'ok') {
                // A valid v3 observed re-enables the session: clears a stale
                // 'unsupported' flag (e.g. another tab removed the future format
                // or the key was rewritten). Without this, the refusal stuck
                // forever and no later save would work again.
                if (storageState.unsupported) storageState.unsupported = false;
                storageState.lastRev = current.rev;
                // Fixes old/dirty data without showing visual feedback during load.
                // The legacy v2 is only removed if v3 was already intact or the
                // corrective rewrite confirmed success: otherwise, a write failure
                // (e.g. quota) would erase the backup along with the attempt.
                let persisted = true;
                if (rewrite && current.needsRewrite) {
                    const fix = saveInventoryToStorage(current.inventory, { silent: true });
                    persisted = !!(fix && fix.ok);
                }
                // saveInventoryToStorage already clears the legacy key on success; this
                // explicit clear covers the case where no rewrite was needed.
                if (rewrite && persisted) clearLegacyStorage();
                return current.inventory;
            }

            // ...and only then the old version, fully independent of the current one.
            const legacy = readInventoryVersion(LEGACY_STORAGE_KEY, { unwrapCollected: false });
            if (legacy.status === 'ok') {
                // v2 -> v3 migration: only deletes the backup AFTER confirming the
                // v3 write worked. If the save fails, v2 remains as the only
                // valid copy for the next attempt.
                // (A successful save already clears the legacy key internally; the point
                // here is to NOT clear it when the save fails.)
                let migrated = true;
                if (rewrite) {
                    const r = saveInventoryToStorage(legacy.inventory, { silent: true });
                    migrated = !!(r && r.ok);
                    if (!migrated) {
                        // Migration failure: the data lives only in memory. Without tombstones,
                        // the next commit with dirty=true would rebase over the empty
                        // snapshot and erase the migrated inventory. Records the intent
                        // so rebaseWithPending preserves it (dirty was already turned on
                        // by the save that failed / refused the future format).
                        trackPendingOps(Object.keys(legacy.inventory), []);
                        storageState.dirty = true;
                    }
                } else {
                    // Cross-tab sync (rewrite:false) does not persist: the migrated
                    // data is not on disk yet, so it also needs tombstones + dirty
                    // to avoid being lost on the next commit.
                    trackPendingOps(Object.keys(legacy.inventory), []);
                    storageState.dirty = true;
                }
                // Normal migration (empty v3 + valid v2) is silent. But if v3
                // EXISTED and was unreadable, v2 is an old snapshot: warn about
                // the rollback instead of pretending nothing happened. The warning is applied
                // AFTER the save, because a successful save clears warnings. If the
                // migration FAILED, keep the 'unsaved' the save already showed (more
                // accurate: the data is in memory, not persisted).
                if (current.status === 'corrupt' && storageState.available !== false
                    && (!rewrite || migrated)) {
                    setStorageWarning('rollback');
                }
                return legacy.inventory;
            }

            // No version recoverable and at least one corrupted: the saved progress
            // was lost. The user needs to know this before starting over from scratch
            // without understanding why. 'blocked' was already flagged during the read and takes precedence.
            if (storageState.available !== false
                && (current.status === 'corrupt' || legacy.status === 'corrupt')) {
                setStorageWarning('corrupt');
            }
            return {};
        }

        // available: null = not tested yet | true = writing | false = blocked by the browser
        // dirty: there are local changes that have not reached storage.
        // SINGLE SOURCE of truth about "there are unsaved changes" — do not keep a second
        // parallel flag (they desynced after partial write recoveries).
        // unsupported: the v3 key contains a newer format (e.g. version 4) that this
        // code cannot interpret; while active, no write may occur.
        // pending: local operations not yet confirmed on disk. A bare `dirty` boolean
        // cannot distinguish "key missing because it never existed" from "key missing
        // because the user deleted it" — the spread merge `{...remote, ...local}`
        // resurrected unsaved deletions. The tombstones below preserve the intent.
        const storageState = {
            available: null, lastRev: null, warningKind: null, dirty: false,
            unsupported: false,
            pending: { added: {}, removed: {} }
        };

        // Records the intent (add/remove) idempotently: checking and unchecking the
        // same flower in sequence cancels the pair, instead of accumulating contradictions.
        function trackPendingOps(added, removed) {
            const p = storageState.pending;
            (added || []).forEach(id => { p.added[id] = true; delete p.removed[id]; });
            (removed || []).forEach(id => { delete p.added[id]; p.removed[id] = true; });
        }

        function clearPendingOps() {
            storageState.pending.added = {};
            storageState.pending.removed = {};
        }

        // Reapplies the pending intent over a remote snapshot: deletions remain
        // deletions even when the in-memory local state is `{}`.
        function rebaseWithPending(snapshotInventory) {
            const rebased = { ...(snapshotInventory || {}) };
            Object.keys(storageState.pending.removed).forEach(id => { delete rebased[id]; });
            Object.keys(storageState.pending.added).forEach(id => { rebased[id] = true; });
            return normalizeInventory(rebased);
        }

        // Two distinct states: environment without persistence vs. pending changes.
        const WARNING_MESSAGES = {
            blocked: 'Persistence unavailable — the browser blocked local storage. Nothing you check will be saved.',
            unsaved: 'Unsaved changes — could not write right now. Your checks will be lost when the page reloads.',
            corrupt: 'The saved data is corrupted and could not be read — the collection appears empty. When you check a flower, the old record will be replaced.',
            rollback: 'The current data was corrupted and an older version was restored — recent progress may be missing. Check your collection.',
            unsupported: 'This collection was saved by a newer version of the app and cannot be read here — nothing will be changed or overwritten. Open the updated version to continue.'
        };

        // kind: 'blocked' | 'unsaved' | 'corrupt' | 'rollback' | 'unsupported' | null (hidden)
        function setStorageWarning(kind = null) {
            const warning = document.getElementById('saveWarning');
            if (!warning) return;
            storageState.warningKind = kind;

            if (!kind) {
                warning.classList.add('hidden');
                return;
            }

            // An unknown kind must never result in an empty warning: ignore it.
            if (!WARNING_MESSAGES[kind]) return;

            const textEl = warning.querySelector('[data-warning-text]');
            if (textEl) textEl.textContent = WARNING_MESSAGES[kind];
            warning.dataset.kind = kind;
            warning.classList.remove('hidden');
        }

        // Read failure at startup: warn at the moment persistence becomes unavailable,
        // without waiting for the first write to fail.
        function markStorageBlocked(err) {
            if (storageState.available === false) return;
            storageState.available = false;
            console.warn("Local storage unavailable:", err);
            setStorageWarning('blocked');
        }

        let savePulseTimer = null;

        // A failure must erase the pending "Saved" pulse: the two states can never coexist.
        function cancelSavePulse() {
            clearTimeout(savePulseTimer);
            savePulseTimer = null;
            const indicator = document.getElementById('saveIndicator');
            if (indicator) indicator.classList.remove('visible');
        }

        function triggerSavePulse() {
            const ind = document.getElementById('saveIndicator');
            ind.classList.add('visible');
            clearTimeout(savePulseTimer);
            savePulseTimer = setTimeout(() => ind.classList.remove('visible'), 1200);
        }

        // Silent probe of the v3 key: true only if there is an explicit `version`
        // different from 3. Any other case (absent, unreadable, blocked, no version
        // field) returns false — the detailed analysis belongs to readInventoryVersion;
        // here the only concern is not destroying a future format.
        function storedVersionIsUnsupported() {
            let raw = null;
            try {
                raw = localStorage.getItem(STORAGE_KEY);
            } catch (err) {
                return false;
            }
            if (!raw) return false;
            try {
                const parsed = JSON.parse(raw);
                return !!(isPlainObject(parsed) && 'version' in parsed && parsed.version !== 3);
            } catch (err) {
                return false;
            }
        }

        // Synchronous mutex across tabs to make check-then-write atomic.
        // localStorage has no CAS: two saves that read the same rev and write in
        // sequence make the last one overwrite the first (lost update). The lock
        // serializes the `expectedRev? + setItem` section between tabs using the same
        // protocol. Expires in 2s so it never hangs if a tab dies holding the lock.
        // The 'storage' listener ignores this key (filters by STORAGE_KEY).
        const INVENTORY_LOCK_KEY = 'flowerGuideInventory_v3.lock';

        function acquireInventoryLock(timeoutMs = 600) {
            const token = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
                let current = null;
                try {
                    current = localStorage.getItem(INVENTORY_LOCK_KEY);
                } catch (err) {
                    return null; // storage blocked: continue best-effort
                }
                if (current) {
                    try {
                        const parsed = JSON.parse(current);
                        if (parsed && parsed.exp && parsed.exp > Date.now() && parsed.token) {
                            const wait = 5 + Math.random() * 12;
                            const start = Date.now();
                            while (Date.now() - start < wait) { /* short synchronous backoff */ }
                            continue;
                        }
                    } catch (err) {
                        // corrupted lock: tries to take ownership below
                    }
                }
                try {
                    const payload = JSON.stringify({ token, exp: Date.now() + 2000 });
                    localStorage.setItem(INVENTORY_LOCK_KEY, payload);
                    const check = localStorage.getItem(INVENTORY_LOCK_KEY);
                    if (check === payload) return token;
                } catch (err) {
                    return null;
                }
                const wait = 5 + Math.random() * 15;
                const start = Date.now();
                while (Date.now() - start < wait) { /* lost the race, try again */ }
            }
            return null;
        }

        function releaseInventoryLock(token) {
            if (!token) return;
            try {
                const cur = localStorage.getItem(INVENTORY_LOCK_KEY);
                if (!cur) return;
                try {
                    const parsed = JSON.parse(cur);
                    if (parsed && parsed.token === token) localStorage.removeItem(INVENTORY_LOCK_KEY);
                } catch (err) {
                    try { localStorage.removeItem(INVENTORY_LOCK_KEY); } catch (e) { /* ignore */ }
                }
            } catch (err) { /* ignore */ }
        }

        // Writes and reports the result — updating the screen never counts as persistence.
        // expectedRev enables optimistic concurrency control across tabs.
        function saveInventoryToStorage(inv, options = {}) {
            const safeInventory = normalizeInventory(inv);

            // Guard against a future format: if v3 contains a `version` other than 3
            // (written by a newer app version, maybe in another tab after boot),
            // refuse the write instead of destroying the format.
            if (storedVersionIsUnsupported()) {
                storageState.unsupported = true;
                // A refusal is also unpersisted data: mark dirty so the
                // beforeunload/pagehide warns and the next commit rebases instead
                // of silently losing the checks.
                storageState.dirty = true;
                cancelSavePulse();
                if (storageState.available !== false) setStorageWarning('unsupported');
                return { ok: false, conflict: false, unsupported: true };
            }
            // Stale flag (the key is back to valid v3): re-enables saves.
            if (storageState.unsupported) {
                storageState.unsupported = false;
                if (storageState.warningKind === 'unsupported') setStorageWarning(null);
            }

            // Atomic critical section across tabs: check expectedRev + write under lock.
            const useLock = options.expectedRev !== undefined;
            const lockToken = useLock ? acquireInventoryLock(600) : null;
            // A lock timeout must not block forever: release once without lock — if the rev
            // changed, it is a real conflict and the commit's retry tries again instead of
            // blindly overwriting. Without expectedRev (migration/boot) it continues
            // best-effort even without a lock.
            if (useLock && lockToken === null) {
                // Could not serialize (contention or blocked storage).
                // Release once without lock: if the rev changed, it is a real
                // conflict; if equal, proceed to the best-effort write.
                try {
                    const probe = readCurrentSnapshot();
                    if (probe && probe.rev !== options.expectedRev) {
                        return { ok: false, conflict: true, inventory: probe.inventory, rev: probe.rev };
                    }
                } catch (err) { /* continue best-effort */ }
            }
            try {
                if (options.expectedRev !== undefined) {
                    const snapshot = readCurrentSnapshot();
                    if (snapshot && snapshot.rev !== options.expectedRev) {
                        // Another tab wrote after the version used as base.
                        return { ok: false, conflict: true, inventory: snapshot.inventory, rev: snapshot.rev };
                    }
                }

                const rev = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
                const payload = { version: 3, updated: Date.now(), rev, collected: safeInventory };

                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
                } catch (err) {
                    console.error("Error saving to localStorage:", err);
                    cancelSavePulse();
                    storageState.dirty = true;
                    if (err && err.name === 'SecurityError') storageState.available = false;
                    setStorageWarning(storageState.available === false ? 'blocked' : 'unsaved');
                    return { ok: false, conflict: false };
                }

                storageState.available = true;
                // A valid v3 write also re-enables the session (in case the
                // 'unsupported' warning was still visible due to a stale flag).
                storageState.unsupported = false;
                storageState.dirty = false;
                clearPendingOps();
                storageState.lastRev = rev;
                // v3 was written successfully: the legacy v2 is no longer useful.
                // Removing it here (in addition to on load) closes the window for a
                // silent rollback in the case where v3 was already valid and the legacy
                // key was never consulted. `options.silent` refers only to the visual
                // pulse, not to the cleanup.
                if (!options.keepLegacy) clearLegacyStorage();
                setStorageWarning(null);
                if (!options.silent) triggerSavePulse();
                return { ok: true, conflict: false, rev };
            } finally {
                releaseInventoryLock(lockToken);
            }
        }

        const MAX_COMMIT_ATTEMPTS = 4;

        // Applies a local change over the most recent base and writes.
        // If another tab wrote in between, redoes the merge over the new state instead of overwriting.
        // options.replace=true (reset): imposes the exact state instead of merging a delta —
        // flowers added by another tab between the click and the commit are also
        // removed, instead of surviving the reset.
        function commitInventoryChange(applyDelta, options = {}) {
            let adoptedRemote = false;
            const isReplace = !!options.replace;
            let lastNext = null;

            for (let attempt = 1; attempt <= MAX_COMMIT_ATTEMPTS; attempt++) {
                const snapshot = readCurrentSnapshot();
                // Null snapshot = future format, corrupted or blocked: no reliable
                // remote base; tries to write from the in-memory state (the
                // save refuses on its own if it is a future format).
                if (snapshot) {
                    const remoteIsNewer = snapshot.rev !== storageState.lastRev;

                    // Local pending changes that never reached disk also force a rebase.
                    // Before, `dirty` was only consulted INSIDE the rev branch: after a
                    // write failure the rev did not change, the base went back to the
                    // storage one and the pending change was overwritten on the next attempt.
                    const hasLocalPending = storageState.dirty;

                    if (remoteIsNewer || hasLocalPending) {
                        storageState.lastRev = snapshot.rev;
                        // Rebase via pending tombstones, NOT by spread: `{...remote,
                        // ...local}` does not represent deletion (key absent on both
                        // sides) and resurrected unsaved deletions.
                        // In replace mode the rebase is ignored: the final delta imposes
                        // the exact state anyway.
                        if (!isReplace) {
                            appState.inventory = hasLocalPending
                                ? rebaseWithPending(snapshot.inventory)
                                : snapshot.inventory;
                        } else if (remoteIsNewer) {
                            appState.inventory = snapshot.inventory;
                        }
                        // Only needs a redraw when the remote base changed; with a local
                        // pending change the grid already reflects the in-memory state.
                        adoptedRemote = remoteIsNewer;

                        if (remoteIsNewer) {
                            // The history describes a sequence of states that is no longer the
                            // current one (same policy as the "storage" listener): undoing over
                            // a swapped base could apply the wrong direction.
                            appState.history = [];
                        }
                    }
                }

                const next = isReplace
                    ? normalizeInventory(applyDelta(null))
                    : normalizeInventory(applyDelta(appState.inventory));
                lastNext = next;
                const result = saveInventoryToStorage(next, { ...options, expectedRev: storageState.lastRev });

                if (result.ok) {
                    appState.inventory = next;
                    return { ok: true, inventory: next, attempts: attempt, adoptedRemote };
                }

                if (result.unsupported) {
                    // Future format: nothing was written and nothing can be merged.
                    // Keeps the intent in memory (optimistic) + dirty so the
                    // unload warns; the 'unsupported' warning takes precedence over 'unsaved'.
                    appState.inventory = next;
                    storageState.dirty = true;
                    return { ok: false, unsupported: true, inventory: next, attempts: attempt, adoptedRemote };
                }

                if (!result.conflict) {
                    // Real write failure: keeps in memory; the warning is already in the UI.
                    appState.inventory = next;
                    return { ok: false, inventory: next, attempts: attempt, adoptedRemote };
                }

                // Conflict: adopt the other tab's version and reapply the pending intent
                // over it (same reason as the rebase above: spread resurrects deletions).
                storageState.lastRev = result.rev;
                if (!isReplace) {
                    appState.inventory = storageState.dirty
                        ? rebaseWithPending(result.inventory)
                        : result.inventory;
                } else {
                    appState.inventory = result.inventory;
                    // In replace mode, ensure a reset that fails later keeps
                    // removing the observed remote keys: record them as a pending
                    // removal for the next rebase/flush.
                    trackPendingOps([], Object.keys(result.inventory));
                    storageState.dirty = true;
                }
                adoptedRemote = true;
                // Same policy as the branch above: the base changed under the history.
                appState.history = [];
            }

            console.warn("Write did not converge after several merge attempts.");
            storageState.dirty = true;
            if (storageState.unsupported) {
                if (storageState.available !== false) setStorageWarning('unsupported');
            } else {
                setStorageWarning('unsaved');
            }
            // Preserves the local intent in memory (optimistic) instead of exposing the
            // pure remote snapshot: otherwise, the internal state went back to remote
            // but the caller updated the card as if it had applied — grid and
            // counters diverged. The rebase reapplies the pending tombstones
            // (which include the current delta) over the latest remote state.
            // In replace mode, the intent is the exact state (reset => {}): keep the
            // optimistic one instead of the pure remote, otherwise the grid came back
            // full but the toast said "reset in this session".
            if (!isReplace) {
                try {
                    const last = readCurrentSnapshot();
                    appState.inventory = last
                        ? rebaseWithPending(last.inventory)
                        : rebaseWithPending(appState.inventory);
                } catch (err) {
                    appState.inventory = rebaseWithPending(appState.inventory);
                }
            } else if (lastNext) {
                appState.inventory = lastNext;
            }
            return { ok: false, inventory: appState.inventory, attempts: MAX_COMMIT_ATTEMPTS, adoptedRemote };
        }

        // Single In-Memory Application State
        const appState = {
            inventory: loadInventoryFromStorage(),
            filters: {
                seed: '',
                type: '',
                search: '',
                sort: 'default'
            },
            history: [],
            toastTimeout: null,
            searchTimer: null
            // "There are unsaved changes" is read from storageState.dirty (single source).
        };

        // Returns the real write result: callers need it to avoid
        // announcing as saved something the browser refused.
        // The change enters as a DELTA over the most recent base, so that one tab's
        // write does not erase what the other checked.
        // options.replace=true (reset): imposes the exact state instead of merging —
        // removes even flowers another tab added after the local read.
        function setInventoryState(newInv, options = {}) {
            const isReplace = !!options.replace;
            const next = normalizeInventory(newInv);
            const previous = appState.inventory || {};

            if (isReplace) {
                // Reset: discards pending adds (intent is to empty) and marks
                // all local keys as removals; remote keys observed in the commit
                // also become tombstones (see commitInventoryChange).
                storageState.pending.added = {};
                trackPendingOps([], Object.keys(previous));
            } else {
                const added = Object.keys(next).filter(id => !previous[id]);
                const removed = Object.keys(previous).filter(id => !next[id]);

                // Records the intent BEFORE the commit so that a rebase midway
                // (another tab wrote, or dirty from a previous failure) reapplies
                // adds AND removes — including the reset to `{}`. Cleared on save ok.
                trackPendingOps(added, removed);
            }

            const commitFn = isReplace
                ? () => normalizeInventory(newInv)
                : (base) => {
                    // Recomputes the delta against the commit's current base (not against
                    // the stale input snapshot): merges add/remove without
                    // resurrecting deletions.
                    const prevKeys = new Set(Object.keys(previous));
                    const nextKeys = new Set(Object.keys(next));
                    const merged = { ...base };
                    nextKeys.forEach(id => { if (!prevKeys.has(id)) merged[id] = true; });
                    prevKeys.forEach(id => { if (!nextKeys.has(id)) delete merged[id]; });
                    return merged;
                };

            const result = commitInventoryChange(commitFn, { ...options, replace: isReplace });

            appState.inventory = result.inventory;
            // storageState.dirty was already updated by saveInventoryToStorage/commitInventoryChange:
            // a second flag here only created divergence between the two.

            // A remote base adopted midway leaves the grid outdated:
            // redraw instead of trusting only the incremental adjustment of the clicked card.
            if (result.adoptedRemote) renderView();

            return result;
        }

        /* =========================================
           9. TOAST & UNDO LIFECYCLE
           ========================================= */
        function getLatestHistoryAction() {
            return appState.history.length > 0
                ? appState.history[appState.history.length - 1]
                : null;
        }

        function hideToastUndo() {
            const toastUndoBtn = document.getElementById('toastUndoBtn');
            toastUndoBtn.classList.add('hidden');
            toastUndoBtn.removeAttribute('aria-label');
        }

        // Closes the notification and cancels the pending timer.
        function dismissToast() {
            clearTimeout(appState.toastTimeout);
            appState.toastTimeout = null;
            document.getElementById('toast').classList.remove('show');
            hideToastUndo();
        }

        function showToast(message, actionData = getLatestHistoryAction()) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');

            clearTimeout(appState.toastTimeout);
            toastText.textContent = message;

            if (actionData) {
                const toastUndoBtn = document.getElementById('toastUndoBtn');
                toastUndoBtn.classList.remove('hidden');
                toastUndoBtn.setAttribute('aria-label', `Undo change on ${actionData.name}`);
            } else {
                hideToastUndo();
            }

            toast.classList.add('show');

            appState.toastTimeout = setTimeout(dismissToast, 4000);
        }

        // Inserts the card at the position it occupies in getFilteredFlowers(),
        // instead of always pushing it to the end of the target grid.
        function insertCardInOrder(targetGrid, card) {
            const isCollected = card.classList.contains('collected');
            const orderedIds = getFilteredFlowers()
                .filter(f => (!!appState.inventory[f.id]) === isCollected)
                .map(f => f.id);

            const index = orderedIds.indexOf(card.dataset.id);
            if (index < 0) {
                targetGrid.appendChild(card);
                return;
            }

            // Walks ALL the following indices until it finds the first card that actually
            // exists in the target grid's DOM. Looking only at orderedIds[index + 1] made the
            // search return null when the immediate neighbor was absent (e.g. in another
            // grid partition) and the card was thrown to the end, corrupting the order.
            for (let i = index + 1; i < orderedIds.length; i++) {
                const nextCard = targetGrid.querySelector(
                    `.flower-card[data-id="${CSS.escape(orderedIds[i])}"]`
                );
                if (nextCard) {
                    targetGrid.insertBefore(card, nextCard);
                    return;
                }
            }

            // No successor present: the correct position is the end of the grid.
            targetGrid.appendChild(card);
        }

        // Keeps the labels and visibility of the two sections consistent with the real DOM of the grids.
        // Without the label on "Pending", two full lists of flowers were indistinguishable.
        function syncSections() {
            const missingCount = document.getElementById('missingGrid').children.length;
            const collectedCount = document.getElementById('collectedGrid').children.length;

            document.getElementById('missingSection').classList.toggle('hidden', missingCount === 0);
            document.getElementById('collectedSection').classList.toggle('hidden', collectedCount === 0);
            document.getElementById('missingLabel').textContent = `Pending (${missingCount})`;
            document.getElementById('collectedLabel').textContent = `Grown (${collectedCount})`;
        }

        function updateCardState(id, isCollected) {
            const card = document.querySelector(`.flower-card[data-id="${CSS.escape(id)}"]`);
            if (!card) return null;

            // The node is moved, never recreated: the expanded state ("best route") survives the grid swap.
            // Since moving a node blurs the active element, we save and restore focus.
            const focusedEl = card.contains(document.activeElement) ? document.activeElement : null;

            const checkbox = card.querySelector('.checkbox-btn');
            card.classList.toggle('collected', isCollected);

            if (checkbox) {
                checkbox.setAttribute('aria-checked', isCollected ? 'true' : 'false');
                checkbox.setAttribute(
                    'aria-label',
                    isCollected
                        ? `Uncheck ${card.querySelector('.flower-name')?.textContent || id}`
                        : `Mark ${card.querySelector('.flower-name')?.textContent || id} as grown`
                );
            }

            const targetGrid = isCollected
                ? document.getElementById('collectedGrid')
                : document.getElementById('missingGrid');
            if (targetGrid && card.parentElement !== targetGrid) {
                insertCardInOrder(targetGrid, card);
            }

            if (focusedEl && focusedEl.isConnected) focusedEl.focus();

            // Updates the labels and visibility of the two sections from the real DOM.
            syncSections();

            return checkbox;
        }

        function updateProgressOnly() {
            renderGlobalProgress();
            const filtered = getFilteredFlowers();
            const filteredCollectedCount = filtered.filter(f => !!appState.inventory[f.id]).length;
            renderFilteredProgress(filtered.length, filteredCollectedCount);
        }

        document.getElementById('toastUndoBtn').addEventListener('click', () => {
            const action = getLatestHistoryAction();
            if (!action) {
                // No pending action means nothing to undo: just close the notification.
                dismissToast();
                return;
            }

            appState.history.pop();
            const updatedInv = { ...appState.inventory };

            if (action.prev) {
                updatedInv[action.id] = true;
            } else {
                delete updatedInv[action.id];
            }

            const persisted = setInventoryState(updatedInv).ok;

            // Uses the effective in-memory state (it may diverge from the intended one if
            // the commit adopted a remote base and did not converge): card and counters must
            // never show "applied" when the internal state ended up remote.
            const effectiveUndo = !!appState.inventory[action.id];
            const restoredCheckbox = updateCardState(action.id, effectiveUndo);
            updateProgressOnly();

            // Focus must be captured BEFORE showToast: when undoing the last action
            // the button is hidden, and hiding a focused element returns focus to <body> —
            // the comparison with activeElement afterwards would never match.
            const focusWasOnUndo = document.activeElement === document.getElementById('toastUndoBtn');

            showToast(
                persisted
                    ? `Undid change on: ${action.name}`
                    : `Undid change on: ${action.name} — could not save; it will be lost when the page reloads.`,
                getLatestHistoryAction()
            );

            if (focusWasOnUndo) {
                if (restoredCheckbox) {
                    restoredCheckbox.focus();
                } else {
                    // Card absent (flower outside the current filters): predictable keyboard landing spot.
                    document.getElementById('searchInput').focus();
                }
            }
        });

        function toggleFlowerStatus(id) {
            const flower = flowerDatabase.find(f => f.id === id);
            if (!flower) return;

            const wasCollected = !!appState.inventory[id];
            const nextState = !wasCollected;
            const updatedInv = { ...appState.inventory };

            if (nextState) {
                updatedInv[id] = true;
            } else {
                delete updatedInv[id];
            }

            appState.history.push({ id, prev: wasCollected, name: flower.name });
            // Undo is intentionally volatile and short: 20 steps in memory, no
            // persistence. Reloading the page, resetting, or receiving state from another
            // tab clears the history — the 4s toast is the only undo window.
            if (appState.history.length > 20) appState.history.shift();

            // The change takes effect in memory before anything else: the card already
            // appears checked. The message only confirms the write if it actually happened.
            // The card reflects the EFFECTIVE state (result.inventory), not the intended one:
            // after 4 conflicts without convergence the internal state preserves the intent via
            // rebase, and the card follows it — never shows success over a remote base.
            const commitResult = setInventoryState(updatedInv);
            const persisted = !!(commitResult && commitResult.ok);
            const effectiveState = !!appState.inventory[id];
            const checkbox = updateCardState(id, effectiveState);
            updateProgressOnly();

            const statusLabel = effectiveState ? `✓ ${flower.name} grown` : `↺ ${flower.name} unchecked`;
            showToast(
                persisted
                    ? statusLabel
                    : `${statusLabel} — could not save; the change will be lost when the page reloads.`,
                getLatestHistoryAction()
            );

            // The same DOM element is preserved; focus is not lost.
            if (checkbox) checkbox.focus();
        }

        /* =========================================
           10. DOM CARD CREATION
           ========================================= */
        // Expansions ("Show all" / "Best route") that must survive full re-renders:
        // renderView recreates all nodes, and moving a card only preserves the
        // state in the individual toggle. IDs are finite (the flower database itself).
        const expandedCards = { recipes: new Set(), bestPath: new Set() };

        function createFlowerCard(flower, isCollected) {
            const card = document.createElement('article');
            card.className = `flower-card ${isCollected ? 'collected' : ''}`;
            card.dataset.id = flower.id;

            const header = document.createElement('div');
            header.className = 'flower-header';

            const titleBox = document.createElement('div');
            titleBox.className = 'flower-title-box';

            const nameEl = document.createElement('span');
            nameEl.className = 'flower-name';
            nameEl.textContent = flower.name;

            const badgeRow = document.createElement('div');
            badgeRow.className = 'flower-badge-row';

            const seedTag = document.createElement('span');
            seedTag.className = 'tag';
            seedTag.textContent = flower.seed.split(' (')[0];

            const typeTag = document.createElement('span');
            typeTag.className = 'tag';
            typeTag.textContent = flower.type;

            badgeRow.appendChild(seedTag);
            badgeRow.appendChild(typeTag);
            titleBox.appendChild(nameEl);
            titleBox.appendChild(badgeRow);

            const checkBtn = document.createElement('button');
            checkBtn.type = 'button';
            checkBtn.className = 'checkbox-btn';
            checkBtn.setAttribute('role', 'checkbox');
            checkBtn.setAttribute('aria-checked', isCollected ? 'true' : 'false');
            checkBtn.setAttribute(
                'aria-label',
                isCollected
                    ? `Uncheck ${flower.name}`
                    : `Mark ${flower.name} as grown`
            );

            // The icon is isolated and hidden by CSS: outside the reading flow and invisible
            // while the checkbox is unchecked, even in high contrast.
            const checkIcon = document.createElement('span');
            checkIcon.className = 'check-icon';
            checkIcon.setAttribute('aria-hidden', 'true');
            checkIcon.textContent = '✓';
            checkBtn.appendChild(checkIcon);

            checkBtn.addEventListener('click', () => {
                toggleFlowerStatus(flower.id);
            });

            header.appendChild(titleBox);
            header.appendChild(checkBtn);
            card.appendChild(header);

            if (flower.recipes.length > 0) {
                const recipeBox = document.createElement('div');
                recipeBox.className = 'recipe-box';

                const recipeHeader = document.createElement('span');
                recipeHeader.className = 'recipe-header';
                recipeHeader.textContent = `Crossbreeds (${flower.recipes.length}):`;
                recipeBox.appendChild(recipeHeader);

                const recipeList = document.createElement('ul');
                recipeList.className = 'recipe-list';

                const LIMIT = 3;
                const hasOverflow = flower.recipes.length > LIMIT;
                const visibleRecipes = hasOverflow ? flower.recipes.slice(0, LIMIT) : flower.recipes;

                visibleRecipes.forEach(rec => {
                    const li = document.createElement('li');
                    li.textContent = `+ ${rec}`;
                    recipeList.appendChild(li);
                });
                recipeBox.appendChild(recipeList);

                if (hasOverflow) {
                    const expandBtn = document.createElement('button');
                    expandBtn.type = 'button';
                    expandBtn.className = 'expand-btn';

                    // Exposes the button -> list relationship and the state (collapsed/expanded)
                    // to assistive technologies, which previously did not know whether the list had grown.
                    recipeList.id = `recipes-${flower.id}`;
                    expandBtn.setAttribute('aria-controls', recipeList.id);
                    expandBtn.setAttribute('aria-expanded', 'false');
                    let expanded = expandedCards.recipes.has(flower.id);

                    const renderRecipeList = () => {
                        recipeList.innerHTML = '';
                        const currentList = expanded ? flower.recipes : flower.recipes.slice(0, LIMIT);
                        currentList.forEach(rec => {
                            const li = document.createElement('li');
                            li.textContent = `+ ${rec}`;
                            recipeList.appendChild(li);
                        });
                        expandBtn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
                        expandBtn.textContent = expanded ? 'Show less ↑' : `Show all (${flower.recipes.length}) ↓`;
                    };
                    renderRecipeList();

                    expandBtn.addEventListener('click', () => {
                        expanded = !expanded;
                        if (expanded) {
                            expandedCards.recipes.add(flower.id);
                        } else {
                            expandedCards.recipes.delete(flower.id);
                        }
                        renderRecipeList();
                    });
                    recipeBox.appendChild(expandBtn);
                }
                card.appendChild(recipeBox);
            }

            if (flower.bestTime) {
                const pathOpen = expandedCards.bestPath.has(flower.id);

                const bestBtn = document.createElement('button');
                bestBtn.type = 'button';
                bestBtn.className = 'best-btn';
                bestBtn.setAttribute('aria-expanded', pathOpen ? 'true' : 'false');
                bestBtn.setAttribute('aria-controls', `path-${flower.id}`);

                const btnLabel = document.createElement('span');
                btnLabel.textContent = `Best route (${flower.bestTime})`;

                const arrow = document.createElement('span');
                arrow.className = 'arrow-icon';
                arrow.textContent = '▼';

                bestBtn.appendChild(btnLabel);
                bestBtn.appendChild(arrow);

                const bestPathBox = document.createElement('div');
                bestPathBox.id = `path-${flower.id}`;
                bestPathBox.className = 'best-path';
                if (pathOpen) bestPathBox.classList.add('open');

                const steps = flower.bestSteps.length > 0 ? flower.bestSteps : [`Estimated time: ${flower.bestTime}`];
                steps.forEach((step, idx) => {
                    const stepDiv = document.createElement('div');
                    stepDiv.className = 'path-step';
                    stepDiv.textContent = step;
                    bestPathBox.appendChild(stepDiv);

                    if (idx < steps.length - 1) {
                        const arrowDiv = document.createElement('div');
                        arrowDiv.className = 'path-arrow';
                        arrowDiv.textContent = '↓';
                        bestPathBox.appendChild(arrowDiv);
                    }
                });

                bestBtn.addEventListener('click', () => {
                    const isOpen = bestPathBox.classList.toggle('open');
                    if (isOpen) {
                        expandedCards.bestPath.add(flower.id);
                    } else {
                        expandedCards.bestPath.delete(flower.id);
                    }
                    bestBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
                });

                card.appendChild(bestBtn);
                card.appendChild(bestPathBox);
            }

            return card;
        }

        /* =========================================
           11. SPECIFIC RENDER MODULES
           ========================================= */
        function getFilteredFlowers() {
            const { seed, type, search, sort } = appState.filters;

            let filtered = flowerDatabase.filter(flower => {
                const matchSeed = !seed || flower.seed === seed;
                const matchType = !type || flower.type === type;
                const matchSearch = !search || flower.searchText.includes(search);
                return matchSeed && matchType && matchSearch;
            });

            if (sort === 'name-asc') {
                filtered.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
            } else if (sort === 'name-desc') {
                filtered.sort((a, b) => b.name.localeCompare(a.name, 'pt-BR'));
            } else if (sort === 'recipes-desc') {
                filtered.sort((a, b) => b.recipes.length - a.recipes.length);
            }

            return filtered;
        }

        function renderGlobalProgress() {
            const total = flowerDatabase.length;
            const collected = flowerDatabase.filter(f => !!appState.inventory[f.id]).length;
            const pct = total === 0 ? 0 : Math.round((collected / total) * 100);

            document.getElementById('progressFill').style.width = `${pct}%`;
            document.getElementById('globalProgressLabel').textContent = `${collected}/${total} (${pct}%)`;
            document.getElementById('globalRemainingLabel').textContent =
                collected === total ? 'Entire collection complete! 🎉' : `${total - collected} remaining`;
        }

        function renderFilteredProgress(filteredCount, filteredCollectedCount) {
            const isFilterActive = !!(appState.filters.seed || appState.filters.type || appState.filters.search);
            const clearBtn = document.getElementById('clearFiltersBtn');
            const filterSubtext = document.getElementById('filterProgressSubtext');

            if (isFilterActive && filteredCount > 0) {
                clearBtn.classList.remove('hidden');
                filterSubtext.classList.remove('hidden');
                filterSubtext.textContent = `Active filter: ${filteredCollectedCount}/${filteredCount} grown`;
            } else {
                if (isFilterActive) {
                    clearBtn.classList.remove('hidden');
                } else {
                    clearBtn.classList.add('hidden');
                }
                filterSubtext.classList.add('hidden');
            }
        }

        function renderEmptyState(filteredCount) {
            const emptyState = document.getElementById('emptyState');
            const emptyMsg = document.getElementById('emptyStateMessage');

            if (filteredCount === 0) {
                emptyState.classList.remove('hidden');
                // With no results, neither section may remain visible with its label.
                document.getElementById('missingSection').classList.add('hidden');
                document.getElementById('collectedSection').classList.add('hidden');

                const reasons = [];
                if (appState.filters.seed) reasons.push(`Seed "${appState.filters.seed.split(' (')[0]}"`);
                if (appState.filters.type) reasons.push(`Type "${appState.filters.type}"`);
                if (appState.filters.search) reasons.push(`Search "${appState.filters.search}"`);

                emptyMsg.textContent = reasons.length > 0
                    ? `No results for: ${reasons.join(' + ')}.`
                    : 'No flowers found.';
                return true;
            }

            emptyState.classList.add('hidden');
            return false;
        }

        function renderFlowerGrid(filtered) {
            const missingGrid = document.getElementById('missingGrid');
            const collectedGrid = document.getElementById('collectedGrid');

            missingGrid.innerHTML = '';
            collectedGrid.innerHTML = '';

            const missingFrag = document.createDocumentFragment();
            const collectedFrag = document.createDocumentFragment();

            let collectedCards = 0;

            filtered.forEach(flower => {
                const isCollected = !!appState.inventory[flower.id];
                const card = createFlowerCard(flower, isCollected);
                if (isCollected) {
                    collectedFrag.appendChild(card);
                    collectedCards++;
                } else {
                    missingFrag.appendChild(card);
                }
            });

            missingGrid.appendChild(missingFrag);
            collectedGrid.appendChild(collectedFrag);

            // Hides the empty section and recalculates both labels at once.
            syncSections();

            return collectedCards;
        }

        // Main Orchestration Function
        function renderView() {
            renderGlobalProgress();

            const filtered = getFilteredFlowers();
            const isEmpty = renderEmptyState(filtered.length);

            if (isEmpty) {
                renderFilteredProgress(0, 0);
                document.getElementById('missingGrid').innerHTML = '';
                document.getElementById('collectedGrid').innerHTML = '';
                return;
            }

            const collectedCount = renderFlowerGrid(filtered);
            renderFilteredProgress(filtered.length, collectedCount);
        }

        /* =========================================
           12. INTERACTION HANDLERS & DEBOUNCE
           ========================================= */
        function setupChipGroup(containerId, stateKey) {
            const container = document.getElementById(containerId);
            container.addEventListener('click', (e) => {
                const chip = e.target.closest('.chip');
                if (!chip) return;

                container.querySelectorAll('.chip').forEach(c => {
                    c.classList.remove('active');
                    c.setAttribute('aria-pressed', 'false');
                });

                chip.classList.add('active');
                chip.setAttribute('aria-pressed', 'true');
                appState.filters[stateKey] = chip.dataset.val || '';
                renderView();
            });
        }

        setupChipGroup('seedChips', 'seed');
        setupChipGroup('typeChips', 'type');

        // Search with Debounce (120ms)
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(appState.searchTimer);
            appState.searchTimer = setTimeout(() => {
                appState.filters.search = e.target.value.toLowerCase().trim();
                renderView();
            }, 120);
        });

        // Sorting
        document.getElementById('sortSelect').addEventListener('change', (e) => {
            appState.filters.sort = e.target.value;
            renderView();
        });

        // Clear filters
        function resetFilters() {
            // Cancels the pending search debounce: without this, the timer fired
            // AFTER the clear, re-enabled the search filter and filtered the grid again.
            clearTimeout(appState.searchTimer);
            appState.searchTimer = null;

            appState.filters.seed = '';
            appState.filters.type = '';
            appState.filters.search = '';
            appState.filters.sort = 'default';

            document.getElementById('searchInput').value = '';
            document.getElementById('sortSelect').value = 'default';

            document.querySelectorAll('.chip-row').forEach(row => {
                row.querySelectorAll('.chip').forEach((c, idx) => {
                    const isFirst = idx === 0;
                    c.classList.toggle('active', isFirst);
                    c.setAttribute('aria-pressed', isFirst ? 'true' : 'false');
                });
            });

            renderView();
        }

        document.getElementById('clearFiltersBtn').addEventListener('click', resetFilters);
        document.getElementById('emptyClearBtn').addEventListener('click', resetFilters);

        // Reset the Entire Collection
        document.getElementById('resetBtn').addEventListener('click', () => {
            if (confirm('Are you sure you want to reset all grown-flower progress?')) {
                appState.history = [];
                // replace:true imposes the exact {}: flowers another tab added
                // after the local read are also removed, instead of
                // surviving via the delta merge.
                const result = setInventoryState({}, { replace: true });
                const persisted = !!(result && result.ok);
                // Only announce success when the browser confirmed the write.
                showToast(
                    persisted
                        ? 'Progress reset successfully.'
                        : 'Progress reset only in this session — could not save.',
                    null
                );
                renderView();
            }
        });

        // Dark/Light Theme — no storage failure may abort initialization.
        const themeToggle = document.getElementById('themeToggle');

        function readThemePreference() {
            try {
                const saved = localStorage.getItem(THEME_KEY);
                return saved === 'light' || saved === 'dark' ? saved : null;
            } catch (err) {
                console.warn("Theme could not be read from localStorage:", err);
                return null;
            }
        }

        function persistThemePreference(theme) {
            try {
                localStorage.setItem(THEME_KEY, theme);
                return true;
            } catch (err) {
                console.warn("Theme could not be saved to localStorage:", err);
                return false;
            }
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
            themeToggle.setAttribute(
                'aria-label',
                theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
            );
        }

        // With no saved preference, the theme comes from the operating system
        // (prefers-color-scheme) instead of forcing dark on those who never touched the button.
        function getSystemTheme() {
            return (typeof window.matchMedia === 'function'
                && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        }

        function initTheme() {
            // The detected preference is NOT saved: until the user chooses
            // explicitly, the app keeps following the system.
            applyTheme(readThemePreference() || getSystemTheme());
        }

        // The system theme can change while the app is open (OS automatic scheduling).
        if (typeof window.matchMedia === 'function') {
            const systemThemeQuery = window.matchMedia('(prefers-color-scheme: light)');
            const onSystemThemeChange = () => {
                if (readThemePreference()) return; // the user's explicit choice takes precedence
                applyTheme(systemThemeQuery.matches ? 'light' : 'dark');
            };

            if (typeof systemThemeQuery.addEventListener === 'function') {
                systemThemeQuery.addEventListener('change', onSystemThemeChange);
            } else if (typeof systemThemeQuery.addListener === 'function') {
                systemThemeQuery.addListener(onSystemThemeChange); // old browsers
            }
        }

        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            applyTheme(next);
            persistThemePreference(next);
        });

        /* =========================================
           13. CROSS-TAB SYNC
           ========================================= */
        // Saves the current focus (card + inner control) to restore it after a
        // full grid rebuild, which recreates every node.
        function captureCardFocus() {
            const active = document.activeElement;
            if (!active || typeof active.closest !== 'function') return null;

            const card = active.closest('.flower-card');
            if (!card) return null;

            const control = ['checkbox-btn', 'expand-btn', 'best-btn']
                .find(cls => active.classList.contains(cls)) || null;

            return { id: card.dataset.id, control };
        }

        function restoreCardFocus(snapshot) {
            if (!snapshot) return;

            const card = document.querySelector(`.flower-card[data-id="${CSS.escape(snapshot.id)}"]`);
            if (!card) return;

            const target = (snapshot.control && card.querySelector(`.${snapshot.control}`))
                || card.querySelector('.checkbox-btn');
            if (target) target.focus();
        }

        // A change made in another tab must reflect on the cards and counters
        // without requiring local interaction or a reload.
        window.addEventListener('storage', (event) => {
            // event.key === null indicates localStorage.clear() in another tab.
            if (event.key !== null && event.key !== STORAGE_KEY && event.key !== LEGACY_STORAGE_KEY) return;

            // Local changes that could not be saved take precedence in this tab; the
            // persistent warning at the top already says they will be lost on reload.
            if (storageState.dirty) return;

            const snapshot = readCurrentSnapshot();
            // Repeated or out-of-order event: nothing new to apply.
            if (snapshot && snapshot.rev !== null && snapshot.rev === storageState.lastRev) return;
            if (snapshot) storageState.lastRev = snapshot.rev;

            const incoming = loadInventoryFromStorage({ rewrite: false });
            // The rev changed but the final content is identical: the other tab's
            // operations cancelled each other out (e.g. checked and unchecked). The directions
            // recorded in the local history remain valid, so it is kept on purpose
            // — clearing it here would destroy undos for no gain. (lastRev was already
            // updated above, so repeated events stay ignored.)
            if (JSON.stringify(incoming) === JSON.stringify(appState.inventory)) return;

            appState.inventory = incoming;
            // The local history describes a sequence of states that is no longer the current one.
            appState.history = [];
            dismissToast();

            const focusSnapshot = captureCardFocus();
            renderView();
            restoreCardFocus(focusSnapshot);
        });

        // Changes that never reached disk deserve a last chance before leaving:
        // tries to persist synchronously (localStorage allows it) and, only if
        // something is still pending, shows the confirmation dialog.
        // beforeunload is unreliable on iOS Safari (often does not even fire);
        // pagehide + visibilitychange cover closing/backgrounding on mobile.
        function tryFlushPendingSaves() {
            if (!storageState.dirty) return;
            // Best-effort commit with an identity delta: the internal rebase reapplies the
            // pending tombstones over the most recent snapshot and tries to write.
            // No rendering here — persistence only. A silent failure falls to the dialog.
            try {
                commitInventoryChange((base) => base, { silent: true });
            } catch (err) {
                console.warn('Final save attempt failed:', err);
            }
        }

        window.addEventListener('beforeunload', (event) => {
            if (!storageState.dirty) return;
            tryFlushPendingSaves();
            if (!storageState.dirty) return;
            event.preventDefault();
            event.returnValue = '';
        });

        // iOS Safari: pagehide is the reliable exit signal; visibilitychange covers
        // the app going to background without being unloaded. Both are synchronous and
        // dialog-free — just best-effort so checks are not lost.
        window.addEventListener('pagehide', () => {
            tryFlushPendingSaves();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') tryFlushPendingSaves();
        });

        // Initialization
        initTheme();
        renderView();
    </script>
</body>
</html>
