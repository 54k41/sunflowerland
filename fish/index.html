<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishing Guide</title>
    <script>
        /* The storage keys are declared here, before the CSS, because the
           anti-FOUC script below needs THEME_KEY. The main script at the end
           of the <body> reuses these constants and does not redeclare them. */
        const STORAGE_KEY = 'fishInventory_v1';
        const THEME_KEY = 'fishTheme_v1';
        const FILTERS_KEY = 'fishFilters_v1';

        /* Anti-FOUC: the theme is decided before the CSS is parsed. Without this
           the page starts in the dark theme (the :root default) and "flashes"
           to light when the script at the end of the <body> runs. */
        (function () {
            let theme = null;

            try {
                const saved = localStorage.getItem(THEME_KEY);
                if (saved === 'dark' || saved === 'light') theme = saved;
            } catch (e) {
                // Storage blocked: fall back to the system preference.
            }

            if (!theme) {
                theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
                    ? 'light'
                    : 'dark';
            }

            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        /* =========================================
           1. VARIABLES & THEMES (Design Tokens)
           ========================================= */
        :root {
            color-scheme: dark;
            --accent: #10b981;
            --accent-muted: rgba(16, 185, 129, 0.15);
            --danger: #f87171;
            --bg-body: #0f1117;
            --bg-surface: #1a1d24;
            --bg-hover: #222630;
            --border: #2e3340;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --radius-sm: 8px;
            --radius-md: 12px;
            --toast-bg: #1f2937;
            --toast-border: #374151;
        }

        [data-theme="light"] {
            color-scheme: light;
            --accent: #059669;
            --accent-muted: rgba(5, 150, 105, 0.12);
            --danger: #dc2626;
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --bg-hover: #f1f5f9;
            --border: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --toast-bg: #ffffff;
            --toast-border: #cbd5e1;
        }

        /* =========================================
           2. BASE
           ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            padding: 24px 16px 80px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.2s, color 0.2s;
        }

        .container {
            max-width: 620px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* =========================================
           3. HEADER
           ========================================= */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 6px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--text-primary);
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: background 0.15s;
        }

        .theme-btn:hover {
            background: var(--bg-surface);
        }

        .theme-btn:focus-visible,
        .chip:focus-visible,
        .fish-card:focus-visible,
        .search-input:focus-visible,
        .search-clear:focus-visible,
        .link-btn:focus-visible,
        .toast-undo-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* =========================================
           4. CHIP FILTERS & VIEW MODES
           ========================================= */
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-label {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .chip-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .chip {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s ease;
        }

        .chip:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        .chip.active {
            background: var(--accent-muted);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
        }

        /* =========================================
           4b. INSTANT SEARCH
           ========================================= */
        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85rem;
            padding: 9px 36px 9px 12px;
            border-radius: var(--radius-sm);
            transition: border-color 0.15s;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-clear {
            position: absolute;
            right: 6px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 0;
            border-radius: 4px;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.8rem;
            line-height: 1;
            cursor: pointer;
        }

        .search-clear:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        /* The hidden attribute needs to win over the display: flex declared above. */
        .search-clear[hidden] {
            display: none;
        }

        /* The type="search" shows a native × button on Chrome/Edge/Safari that
           would overlap the app's .search-clear button. */
        .search-input::-webkit-search-cancel-button {
            display: none;
        }

        /* =========================================
           5. STATUS & DUAL PROGRESS
           ========================================= */
        .progress-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 12px 14px;
            border-radius: var(--radius-md);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .progress-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .progress-numbers {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent);
        }

        .progress-bar {
            height: 6px;
            background: var(--border);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-sub {
            font-size: 0.72rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            gap: 4px 12px;
            flex-wrap: wrap;
        }

        .progress-sub span {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        #filterProgressLabel {
            flex: 1 1 auto;
        }

        #filterProgressCount {
            flex-shrink: 0;
        }

        /* =========================================
           6. FISH LIST (CARD BUTTONS)
           ========================================= */
        .fish-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 10px;
        }

        .fish-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: var(--radius-md);
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-family: inherit;
            color: inherit;
            position: relative;
            transition: transform 0.1s, border-color 0.15s, background-color 0.15s, opacity 0.2s;
        }

        .fish-card:hover {
            border-color: var(--text-secondary);
            background: var(--bg-hover);
        }

        .fish-card:active {
            transform: scale(0.98);
        }

        .fish-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
        }

        .fish-name {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .checkbox-indicator {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 1.5px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            flex-shrink: 0;
            color: transparent;
            background: transparent;
            transition: all 0.15s;
        }

        /* The chum can have two ingredients (e.g. "Crab, Fat Chicken"). With nowrap
           + ellipsis, the second ingredient was cut off without any hint of what
           was missing. Now the text wraps onto up to two lines and the card title
           offers the full list. */
        .fish-meta {
            font-size: 0.72rem;
            color: var(--text-secondary);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            overflow: hidden;
        }

        .fish-meta strong {
            color: var(--text-primary);
            font-weight: 500;
        }

        /* State: Collected */
        .fish-card.collected {
            background: transparent;
            opacity: 0.55;
            border-color: var(--border);
        }

        .fish-card.collected .fish-name {
            text-decoration: line-through;
        }

        .fish-card.collected .checkbox-indicator {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .section-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin: 12px 0 4px;
        }

        .empty-message {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.88rem;
            padding: 32px 0;
            overflow-wrap: anywhere;
        }

        .hidden { display: none !important; }

        /* Text available only to screen readers. */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            white-space: nowrap;
            border: 0;
        }

        /* =========================================
           7. FEEDBACK / UNDO TOAST
           ========================================= */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--toast-bg);
            border: 1px solid var(--toast-border);
            color: var(--text-primary);
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 12px;
            /* The messages carry the pending-changes counter; without
               containment, text + button overflow the width on 360px screens. */
            width: max-content;
            max-width: min(560px, calc(100vw - 32px));
            flex-wrap: wrap;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            font-size: 0.85rem;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
            z-index: 1000;
        }

        .toast-msg {
            flex: 1 1 200px;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .toast.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        /* Closed state: besides being transparent and offset, the toast leaves the
           tab order and the accessibility tree. The .toast class sets display:flex,
           which is why !important is needed for the hidden attribute to win. */
        .toast[hidden] {
            display: none !important;
        }

        .toast-undo-btn {
            background: var(--accent-muted);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* =========================================
           8. DATA ACTIONS (BACKUP)
           ========================================= */
        .data-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px 18px;
        }

        .link-btn {
            background: none;
            border: 0;
            padding: 4px 2px;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.78rem;
            text-decoration: underline;
            text-decoration-color: var(--border);
            text-underline-offset: 3px;
            cursor: pointer;
        }

        .link-btn:hover {
            color: var(--text-primary);
        }

        .link-btn-danger:hover {
            color: var(--danger);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <a class="back-link" href="../">← All guides</a>
                <h1>Fishing Guide</h1>
            </div>
            <button id="themeToggle" class="theme-btn" aria-label="Toggle theme">☀️</button>
        </header>

        <!-- Chip Filters -->
        <div class="filter-group">
            <span class="filter-label" id="viewFilterLabel">View</span>
            <!-- A view mode always needs to be active (they cannot all be
                 unchecked), so the correct semantics is radiogroup: one item
                 selected at a time, exposed via aria-checked. -->
            <div class="chip-row" id="viewChips" role="radiogroup" aria-labelledby="viewFilterLabel">
                <button type="button" class="chip active" data-val="all" role="radio" aria-checked="true" tabindex="0">All</button>
                <button type="button" class="chip" data-val="missing" role="radio" aria-checked="false" tabindex="-1">Missing</button>
                <button type="button" class="chip" data-val="collected" role="radio" aria-checked="false" tabindex="-1">Collected</button>
            </div>
        </div>

        <div class="filter-group">
            <span class="filter-label" id="baitFilterLabel">Bait</span>
            <div class="chip-row" id="baitChips" role="group" aria-labelledby="baitFilterLabel">
                <button type="button" class="chip" data-val="Earthworm" aria-pressed="false">Earthworm</button>
                <button type="button" class="chip" data-val="Grub" aria-pressed="false">Grub</button>
                <button type="button" class="chip" data-val="Fishing Lure" aria-pressed="false">Fishing Lure</button>
                <button type="button" class="chip" data-val="Redwiggler" aria-pressed="false">Redwiggler</button>
            </div>
        </div>

        <div class="filter-group">
            <span class="filter-label" id="seasonFilterLabel">Season</span>
            <div class="chip-row" id="seasonChips" role="group" aria-labelledby="seasonFilterLabel">
                <button type="button" class="chip" data-val="Spring" aria-pressed="false">Spring</button>
                <button type="button" class="chip" data-val="Summer" aria-pressed="false">Summer</button>
                <button type="button" class="chip" data-val="Autumn" aria-pressed="false">Autumn</button>
                <button type="button" class="chip" data-val="Winter" aria-pressed="false">Winter</button>
            </div>
        </div>

        <!-- Detailed Progress -->
        <section class="progress-box" aria-label="Collection Progress">
            <div class="progress-header">
                <span class="progress-title" id="progressTitle">Total Collection Progress</span>
                <span id="globalProgressCount" class="progress-numbers">0/0 (0%)</span>
            </div>
            <!-- The indicator carries its own accessible name: the parent <section>
                 label does not identify the widget for assistive technologies. -->
            <div class="progress-bar" role="progressbar" id="progressBar" aria-labelledby="progressTitle" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <div class="progress-sub">
                <span id="filterProgressLabel">Active filter: All</span>
                <span id="filterProgressCount">0/0 collected</span>
            </div>
        </section>

        <!-- Instant search by fish -->
        <div class="search-box" role="search" aria-label="Search for a fish">
            <label class="sr-only" for="searchInput">Search for a fish</label>
            <input type="search" id="searchInput" class="search-input"
                   placeholder="Search for a fish…" autocomplete="off" spellcheck="false">
            <button type="button" id="searchClear" class="search-clear" aria-label="Clear search" hidden>✕</button>
        </div>

        <!-- Results -->
        <main id="resultsArea">
            <div id="missingContainer">
                <h2 class="section-label" id="missingLabel">Missing</h2>
                <div id="missingGrid" class="fish-grid"></div>
            </div>

            <div id="collectedContainer">
                <h2 class="section-label" id="collectedLabel">Collected</h2>
                <div id="collectedGrid" class="fish-grid"></div>
            </div>

            <div id="emptyState" class="empty-message hidden" tabindex="-1">
                No fish found with the selected filters.
            </div>
        </main>

        <!-- Progress backup: the inventory lives only in this browser's
             localStorage, so exporting/importing/resetting prevents losing
             everything when clearing browser data or switching devices. -->
        <footer class="data-actions">
            <button type="button" id="exportBtn" class="link-btn">Export progress</button>
            <button type="button" id="importBtn" class="link-btn">Import</button>
            <button type="button" id="resetBtn" class="link-btn link-btn-danger">Reset collection</button>
            <input type="file" id="importInput" class="sr-only" accept="application/json,.json"
                   tabindex="-1" aria-hidden="true">
        </footer>
    </div>

    <!-- Feedback with Undo Action.
         The toast is hidden + inert while closed, so the button is not reachable
         by keyboard and does not even exist before the first notification. Since
         this removes it from the accessibility tree, announcements come from the
         permanent live region below (#toastAnnouncer), which never leaves the
         document. -->
    <div id="toast" class="toast" role="group" aria-label="Notification" hidden inert>
        <span id="toastMsg" class="toast-msg"></span>
        <button id="toastUndo" class="toast-undo-btn" type="button">Undo</button>
    </div>

    <div id="toastAnnouncer" class="sr-only" role="status" aria-live="polite"></div>

    <script>
        /* STORAGE_KEY, THEME_KEY and FILTERS_KEY are declared in the <head>
           <script>, which runs before the CSS because of the anti-FOUC. */

        const fishDatabase = [
            { name: "Anchovy", baits: ["Earthworm"], chums: ["Carrot", "Egg"], seasons: ["Spring", "Autumn", "Summer", "Winter"] },
            { name: "Butterflyfish", baits: ["Earthworm"], chums: ["Sunflower"], seasons: ["Summer", "Autumn"] },
            { name: "Blowfish", baits: ["Earthworm"], chums: ["Yam"], seasons: ["Winter"] },
            { name: "Clownfish", baits: ["Earthworm"], chums: ["Cabbage"], seasons: ["Summer", "Winter"] },
            { name: "Sea Bass", baits: ["Earthworm"], chums: ["Anchovy"], seasons: ["Spring", "Autumn"] },
            { name: "Sea Horse", baits: ["Earthworm"], chums: ["Seaweed"], seasons: ["Spring", "Summer"] },
            { name: "Horse Mackerel", baits: ["Earthworm"], chums: ["Blueberry"], seasons: ["Summer", "Winter"] },
            { name: "Halibut", baits: ["Earthworm"], chums: ["Anchovy"], seasons: ["Spring", "Autumn"] },
            { name: "Squid", baits: ["Earthworm"], chums: ["Eggplant", "Onion"], seasons: ["Spring", "Winter"] },
            { name: "Porgy", baits: ["Earthworm"], chums: ["Yam"], seasons: ["Spring"] },
            { name: "Muskellunge", baits: ["Earthworm"], chums: ["Turnip"], seasons: ["Autumn"] },
            { name: "Red Snapper", baits: ["Grub", "Redwiggler", "Fishing Lure"], chums: ["Apple", "Honey"], seasons: ["Spring", "Autumn", "Summer", "Winter"] },
            { name: "Moray Eel", baits: ["Earthworm", "Grub", "Fishing Lure"], chums: ["Gold"], seasons: ["Summer", "Autumn"] },
            { name: "Olive Flounder", baits: ["Earthworm", "Grub", "Fishing Lure"], chums: ["Rhubarb"], seasons: ["Spring", "Autumn"] },
            { name: "Napoleanfish", baits: ["Grub", "Fishing Lure"], chums: ["Carrot"], seasons: ["Summer", "Autumn"] },
            { name: "Surgeonfish", baits: ["Grub", "Fishing Lure"], chums: ["Orange"], seasons: ["Summer", "Autumn"] },
            { name: "Angelfish", baits: ["Grub", "Fishing Lure"], chums: ["Banana"], seasons: ["Summer", "Winter"] },
            { name: "Zebra Turkeyfish", baits: ["Grub", "Fishing Lure"], chums: ["Beetroot", "Rhubarb"], seasons: ["Spring", "Summer"] },
            { name: "Ray", baits: ["Grub", "Fishing Lure"], chums: ["Squid"], seasons: ["Spring", "Summer"] },
            { name: "Hammerhead Shark", baits: ["Grub", "Fishing Lure"], chums: ["Iron"], seasons: ["Summer", "Autumn"] },
            { name: "Barred Knifejaw", baits: ["Grub", "Fishing Lure"], chums: ["Anchovy"], seasons: ["Spring", "Summer"] },
            { name: "Walleye", baits: ["Grub"], chums: ["Broccoli"], seasons: ["Winter"] },
            { name: "Rock Blackfish", baits: ["Grub"], chums: ["Onion"], seasons: ["Autumn"] },
            { name: "Tilapia", baits: ["Grub"], chums: ["Zucchini"], seasons: ["Summer"] },
            { name: "Tuna", baits: ["Grub", "Redwiggler", "Fishing Lure"], chums: ["Orange", "Wild Mushroom"], seasons: ["Spring", "Autumn", "Summer", "Winter"] },
            { name: "Mahi Mahi", baits: ["Grub", "Redwiggler", "Fishing Lure"], chums: ["Corn"], seasons: ["Summer", "Autumn"] },
            { name: "Blue Marlin", baits: ["Grub", "Redwiggler", "Fishing Lure"], chums: ["Wheat"], seasons: ["Summer", "Winter"] },
            { name: "Oarfish", baits: ["Redwiggler", "Fishing Lure"], chums: ["Kale"], seasons: ["Spring", "Winter"] },
            { name: "Football Fish", baits: ["Redwiggler", "Fishing Lure"], chums: ["Sunflower"], seasons: ["Winter"] },
            { name: "Sunfish", baits: ["Redwiggler", "Fishing Lure"], chums: ["Anchovy"], seasons: ["Summer", "Autumn"] },
            { name: "Coelacanth", baits: ["Redwiggler", "Fishing Lure"], chums: ["Cabbage"], seasons: ["Spring", "Winter"] },
            { name: "Parrotfish", baits: ["Redwiggler", "Fishing Lure"], chums: ["Seaweed"], seasons: ["Spring", "Summer"] },
            { name: "Whale Shark", baits: ["Redwiggler", "Fishing Lure"], chums: ["Crab", "Fat Chicken"], seasons: ["Summer", "Winter"] },
            { name: "Saw Shark", baits: ["Redwiggler", "Fishing Lure"], chums: ["Red Snapper", "Speed Chicken"], seasons: ["Spring", "Summer"] },
            { name: "White Shark", baits: ["Redwiggler", "Fishing Lure"], chums: ["Tuna", "Rich Chicken"], seasons: ["Summer", "Winter"] },
            { name: "Cobia", baits: ["Redwiggler"], chums: ["Broccoli"], seasons: ["Summer"] },
            { name: "Trout", baits: ["Redwiggler"], chums: ["Pepper"], seasons: ["Winter"] },
            { name: "Weakfish", baits: ["Redwiggler"], chums: ["Artichoke"], seasons: ["Spring"] }
        ];

        // Cache of the valid names to avoid rebuilding on every getInventory() call
        const validFishNames = new Set(fishDatabase.map(f => f.name));

        // 1 & 4. Storage Helpers with Fallback, Validation and Sanitization
        function safeGetJSON(key, fallback) {
            try {
                const item = localStorage.getItem(key);
                if (!item) return fallback;
                return JSON.parse(item);
            } catch {
                return fallback;
            }
        }

        // Returns true only when the write actually happened.
        function safeSetJSON(key, val) {
            try {
                localStorage.setItem(key, JSON.stringify(val));
                return true;
            } catch (e) {
                console.warn('Failed to save to localStorage:', e);
                return false;
            }
        }

        function sanitizeInventory(raw) {
            if (typeof raw !== 'object' || raw === null || Array.isArray(raw)) return {};

            // Sanitization against fish that do not exist in the database
            const clean = {};
            for (const [key, val] of Object.entries(raw)) {
                if (validFishNames.has(key) && val === true) {
                    clean[key] = true;
                }
            }
            return clean;
        }

        function readInventoryFromStorage() {
            return sanitizeInventory(safeGetJSON(STORAGE_KEY, {}));
        }

        // This tab's inventory lives in memory; localStorage is only the
        // persistent copy. If the write fails, the checkmark stays visible and
        // consistent with what the user just did, but they are warned that
        // nothing was saved.
        let inventoryCache = null;
        let hasUnsavedInventory = false;

        function getInventory() {
            if (inventoryCache === null) {
                inventoryCache = readInventoryFromStorage();
            }
            return { ...inventoryCache };
        }

        function persistInventory(inv) {
            const saved = safeSetJSON(STORAGE_KEY, inv);
            inventoryCache = { ...inv };
            hasUnsavedInventory = !saved;
            return saved;
        }

        // Base for per-fish writes (toggle/undo). Reads the storage on the spot
        // instead of relying only on the cache: if another tab wrote after the
        // last 'storage' event received here, the cache is stale and writing
        // from it would erase the external change (last-write-wins of the whole
        // object). When there is a pending local write (hasUnsavedInventory),
        // the union preserves the marks made here that have not been saved yet;
        // known limitation: the union does not preserve removals (see the
        // 'storage' handler) and favors never losing progress.
        function getBaseInventoryForWrite() {
            const fresh = readInventoryFromStorage();
            if (!hasUnsavedInventory || inventoryCache === null) {
                return fresh;
            }
            return { ...fresh, ...inventoryCache };
        }

        // 8. Initial Filter State with Persistence
        const defaultState = { bait: '', season: '', view: 'all' };

        const viewChipsEl = document.getElementById('viewChips');
        const baitChipsEl = document.getElementById('baitChips');
        const seasonChipsEl = document.getElementById('seasonChips');

        // Validates persisted filters against the values that actually exist in the UI.
        const validBaits = new Set(
            [...baitChipsEl.querySelectorAll('.chip')].map(chip => chip.dataset.val)
        );
        const validSeasons = new Set(
            [...seasonChipsEl.querySelectorAll('.chip')].map(chip => chip.dataset.val)
        );
        const validViews = new Set(
            [...viewChipsEl.querySelectorAll('.chip')].map(chip => chip.dataset.val)
        );

        const state = { bait: '', season: '', view: 'all' };

        // The text search is transient: it is not persisted nor synced between
        // tabs, because it describes what the person is looking for right now.
        let searchQuery = '';

        function validateFilters(raw) {
            const candidate = (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : defaultState;

            return {
                bait: typeof candidate.bait === 'string' && validBaits.has(candidate.bait) ? candidate.bait : '',
                season: typeof candidate.season === 'string' && validSeasons.has(candidate.season) ? candidate.season : '',
                view: validViews.has(candidate.view) ? candidate.view : 'all'
            };
        }

        function readFiltersFromStorage() {
            return validateFilters(safeGetJSON(FILTERS_KEY, defaultState));
        }

        // Applies a set of filters to the state and reflects the choice on the chips.
        function applyFilters(filters) {
            state.bait = filters.bait;
            state.season = filters.season;
            state.view = filters.view;

            applyStateToChips(viewChipsEl, 'view');
            applyStateToChips(baitChipsEl, 'bait');
            applyStateToChips(seasonChipsEl, 'season');
        }

        // Only the three persistable choices are saved — the search stays out.
        function saveFiltersState() {
            safeSetJSON(FILTERS_KEY, { bait: state.bait, season: state.season, view: state.view });
        }

        const rawSavedFilters = safeGetJSON(FILTERS_KEY, defaultState);
        const initialFilters = validateFilters(rawSavedFilters);
        applyFilters(initialFilters);

        // Removes any orphan filters detected at startup from storage. The
        // comparison is field by field (not via JSON.stringify) to avoid
        // rewriting when the saved object only differs in key order. The access
        // is guarded because the saved value may not be an object.
        const savedFilters = (rawSavedFilters && typeof rawSavedFilters === 'object') ? rawSavedFilters : {};
        if (savedFilters.bait !== initialFilters.bait
            || savedFilters.season !== initialFilters.season
            || savedFilters.view !== initialFilters.view) {
            safeSetJSON(FILTERS_KEY, initialFilters);
        }

        // 5 & 9. Safe Theme with System Detection
        const themeToggle = document.getElementById('themeToggle');
        const systemThemeMedia = window.matchMedia
            ? window.matchMedia('(prefers-color-scheme: light)')
            : null;

        function getSystemTheme() {
            return systemThemeMedia && systemThemeMedia.matches ? 'light' : 'dark';
        }

        function getSavedTheme() {
            try {
                const saved = localStorage.getItem(THEME_KEY);
                return (saved === 'dark' || saved === 'light') ? saved : null;
            } catch {
                return null;
            }
        }

        function applyTheme(theme, persist = false) {
            const validTheme = theme === 'light' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', validTheme);
            themeToggle.textContent = validTheme === 'dark' ? '☀️' : '🌙';

            if (persist) {
                try {
                    localStorage.setItem(THEME_KEY, validTheme);
                } catch {}
            }
        }

        function applyCurrentThemePreference() {
            applyTheme(getSavedTheme() || getSystemTheme(), false);
        }

        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            applyTheme(current === 'dark' ? 'light' : 'dark', true);
        });

        // When the user has not chosen a theme manually, follow the system.
        if (systemThemeMedia) {
            const handleSystemThemeChange = () => {
                if (!getSavedTheme()) {
                    applyTheme(getSystemTheme(), false);
                }
            };

            if (typeof systemThemeMedia.addEventListener === 'function') {
                systemThemeMedia.addEventListener('change', handleSystemThemeChange);
            } else if (typeof systemThemeMedia.addListener === 'function') {
                systemThemeMedia.addListener(handleSystemThemeChange);
            }
        }

        // 7. Toast, Undo Feedback and Announcements
        const TOAST_DURATION = 4000;
        const TOAST_CONFIRM_DURATION = 1600;
        const TOAST_EXIT_MS = 300; // slightly above the exit transition (0.25s), so it is hidden only after the animation ends
        const MAX_UNDO_STEPS = 20;

        // Stack of undoable changes. There used to be only a single `lastAction`:
        // each new click overwrote the previous one, so only the last checkmark
        // could be undone. The stack is valid while the undo toast is open.
        let undoStack = [];
        let toastTimeout = null;
        let toastExitTimeout = null;
        let announceTimeout = null;

        const toastEl = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        const toastUndo = document.getElementById('toastUndo');
        const toastAnnouncer = document.getElementById('toastAnnouncer');

        function pluralize(count, singular, plural) {
            return `${count} ${count === 1 ? singular : plural}`;
        }

        // The live region is emptied before receiving the new text: repeated
        // messages in a row ("X marked as collected." twice) would not change the
        // content and some screen readers would announce nothing.
        function announce(message) {
            if (!toastAnnouncer) return;

            if (announceTimeout) clearTimeout(announceTimeout);

            toastAnnouncer.textContent = '';
            announceTimeout = setTimeout(() => {
                announceTimeout = null;
                toastAnnouncer.textContent = message;
            }, 60);
        }

        // The toast enters the tab order and the accessibility tree only while
        // it is visible.
        function openToast() {
            if (toastExitTimeout) {
                clearTimeout(toastExitTimeout);
                toastExitTimeout = null;
            }

            if (toastEl.hidden) {
                toastEl.hidden = false;
                toastEl.removeAttribute('inert');
                void toastEl.offsetWidth; // forces the reflow so the enter transition runs
            }

            toastEl.classList.add('visible');
        }

        // The exit respects the end of the animation: only then is the toast
        // actually hidden.
        function closeToast() {
            toastEl.classList.remove('visible');

            if (toastExitTimeout) clearTimeout(toastExitTimeout);
            toastExitTimeout = setTimeout(() => {
                toastExitTimeout = null;
                if (!toastEl.classList.contains('visible')) {
                    toastEl.hidden = true;
                    toastEl.setAttribute('inert', '');
                }
            }, TOAST_EXIT_MS);
        }

        // Closes the notification without performing an action, cancels the
        // pending timer and ends the undo window.
        function dismissToast() {
            if (toastTimeout) {
                clearTimeout(toastTimeout);
                toastTimeout = null;
            }
            undoStack = [];
            closeToast();
        }

        function pushUndo(action) {
            undoStack.push(action);
            if (undoStack.length > MAX_UNDO_STEPS) undoStack.shift();
        }

        // `undoable: false` (the default) ends the undo window: a notification
        // that is not undoable means the person has already moved on.
        function showToast(message, { undoable = false, duration = TOAST_DURATION } = {}) {
            if (!undoable) undoStack = [];

            toastMsg.textContent = message;
            toastUndo.textContent = undoable
                ? (undoStack.length > 1 ? `Undo (${undoStack.length})` : 'Undo')
                : 'OK';

            announce(message);
            openToast();

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastTimeout = null;
                dismissToast();
            }, duration);
        }

        // After render(), the card only remains in the document if the fish passes
        // the current filters and view mode — the rest is removed from the DOM.
        function isFishCardVisible(name) {
            return ['missingGrid', 'collectedGrid'].some(id => {
                const grid = document.getElementById(id);
                return !!grid && Array.from(grid.children).some(card => card.dataset && card.dataset.fishName === name);
            });
        }

        toastUndo.addEventListener('click', () => {
            // With no pending action the button is just an "OK": closes the
            // notification and cancels the timer instead of doing nothing.
            if (undoStack.length === 0) {
                dismissToast();
                return;
            }

            const entry = undoStack.pop();
            const { name, previousState } = entry;
            const isRetry = !!entry.retryPending;

            // Retry of an undo whose write failed: the cache is ALREADY in the
            // restored state (previousState), so the "external change" guard
            // below would produce a false positive (cache === previousState)
            // and block without trying to write again. That is why the retry
            // skips the guard and re-applies the state idempotently before
            // persisting.
            const inv = getBaseInventoryForWrite();

            if (!isRetry) {
                // If the current state is no longer what the action left behind,
                // something external (another tab, an import) touched this fish
                // after it: restoring blindly would destroy the most recent
                // change.
                if (!!inv[name] === !!previousState) {
                    if (undoStack.length === 0) {
                        showToast(`${name} was changed in another tab and was not modified.`, { duration: TOAST_CONFIRM_DURATION });
                    } else {
                        showToast(
                            `${name} was changed in another tab and was not modified. There ${undoStack.length === 1 ? 'is' : 'are'} still ${pluralize(undoStack.length, 'change', 'changes')} to undo.`,
                            { undoable: true }
                        );
                    }
                    return;
                }
            }

            // Restores exactly the state prior to the action (idempotent on
            // retry: if the cache is already restored, nothing changes and it
            // just tries to write again).
            if (previousState) {
                inv[name] = true;
            } else {
                delete inv[name];
            }

            const saved = persistInventory(inv);
            render();

            // The restored card may not be on screen if a filter or the view
            // mode hides it — the message makes that explicit.
            const hiddenNote = isFishCardVisible(name) ? '' : ' It is hidden by the active filters.';

            if (!saved) {
                // Nothing was saved: the action goes back on the stack and stays
                // undoable. The in-memory reversal has ALREADY happened
                // (persistInventory updates the cache even when the write
                // fails), which is why the message says what the screen shows:
                // the fish was restored, but on reload it returns to the storage
                // state — the opposite of the restored one, because only the
                // original action that was saved successfully enters the stack.
                // retryPending avoids the "external change" false positive on
                // the next click: the cache is already at previousState because
                // of the in-memory restoration, so the retry needs to skip the
                // guard and just try to write again.
                const stateOnReload = previousState ? 'missing' : 'collected';
                undoStack.push({ name, previousState, retryPending: true });
                showToast(
                    `Could not save: ${name} was restored on screen, but on page reload it will go back to ${stateOnReload}.${hiddenNote}`,
                    { undoable: true }
                );
                return;
            }

            if (undoStack.length === 0) {
                showToast(`${name} restored.${hiddenNote}`, { duration: TOAST_CONFIRM_DURATION });
                return;
            }

            showToast(
                `${name} restored.${hiddenNote} There ${undoStack.length === 1 ? 'is' : 'are'} still ${pluralize(undoStack.length, 'change', 'changes')} to undo.`,
                { undoable: true }
            );
        });

        function toggleFish(name) {
            // Starts from the fresh base (not just the cache) so as not to erase
            // changes written by another tab between the last 'storage' event
            // and this click.
            const inv = getBaseInventoryForWrite();
            const previousState = !!inv[name];
            const newState = !previousState;

            if (newState) {
                inv[name] = true;
            } else {
                delete inv[name];
            }

            // The change takes effect in memory before anything else: if the
            // write fails, the card stays checked and the message does not lie
            // about the state.
            const saved = persistInventory(inv);

            render();

            if (saved) {
                pushUndo({ name, previousState });

                const pending = undoStack.length > 1
                    ? ` ${pluralize(undoStack.length, 'change', 'changes')} to undo.`
                    : '';

                showToast(
                    `${name} marked as ${newState ? 'collected' : 'missing'}.${pending}`,
                    { undoable: true }
                );
            } else {
                // The stack is not cleared: previous actions that were saved
                // successfully stay undoable while the toast is open (which is
                // why the toast is undoable if there is anything on the stack).
                // The action that just failed does not enter the stack: undoing
                // it would require writing again, and the storage just refused.
                // When there are previous actions, the text makes explicit that
                // the Undo button refers to them — not to the checkmark that
                // just failed — so as not to create the wrong expectation.
                const priorNote = undoStack.length > 0
                    ? ` The Undo button reverts ${pluralize(undoStack.length, 'previous saved change', 'previous saved changes')}.`
                    : '';
                showToast(
                    `${name} ${newState ? 'marked' : 'unmarked'}, but it could not be saved: the change will be lost on page reload.${priorNote}`,
                    { undoable: undoStack.length > 0 }
                );
            }
        }

        // 6 & 10. Safe and Accessible Card Creation via DOM
        function fishSlug(name) {
            return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        }

        // The card's accessible name comes from its own visible title
        // (aria-labelledby) and the state, from the role="checkbox" aria-checked.
        // There used to be an aria-label that repeated "collected/missing" — the
        // screen reader announced the state twice — and it also swallowed the
        // children's content. The chum becomes the description
        // (aria-describedby), so the text remains reachable.
        function updateFishCard(card, fish, isCollected) {
            const slug = fishSlug(fish.name);

            card.classList.toggle('collected', isCollected);
            card.setAttribute('aria-checked', isCollected ? 'true' : 'false');
            card.setAttribute('aria-labelledby', `fish-name-${slug}`);
            card.setAttribute('aria-describedby', `fish-chum-${slug}`);
        }

        function createFishCard(fish, isCollected) {
            const slug = fishSlug(fish.name);
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'fish-card';
            // Stable identifier: allows reusing the card and returning focus.
            card.dataset.fishName = fish.name;
            card.setAttribute('role', 'checkbox');
            updateFishCard(card, fish, isCollected);

            const header = document.createElement('div');
            header.className = 'fish-header';

            const name = document.createElement('span');
            name.className = 'fish-name';
            name.id = `fish-name-${slug}`;
            name.textContent = fish.name;

            const indicator = document.createElement('span');
            indicator.className = 'checkbox-indicator';
            indicator.textContent = '✓';
            indicator.setAttribute('aria-hidden', 'true');

            header.appendChild(name);
            header.appendChild(indicator);

            const chumText = `Chum: ${fish.chums.join(', ')}`;

            const chum = document.createElement('div');
            chum.className = 'fish-meta';
            chum.id = `fish-chum-${slug}`;
            // The CSS already wraps the text onto up to two lines; the title
            // covers the case of it still not fitting as a whole.
            chum.title = chumText;

            const chumLabel = document.createElement('strong');
            chumLabel.textContent = 'Chum:';
            chum.appendChild(chumLabel);
            chum.appendChild(document.createTextNode(` ${fish.chums.join(', ')}`));

            card.appendChild(header);
            card.appendChild(chum);

            card.addEventListener('click', () => toggleFish(fish.name));
            return card;
        }

        // Interactive Chip Setup
        // Single-choice groups ("View") use the radiogroup semantics: aria-checked
        // and "roving" tabindex, with the arrows moving through the options.
        // Toggle groups (Bait, Season) use aria-pressed.
        function isRadioGroup(container) {
            return container.getAttribute('role') === 'radiogroup';
        }

        // The `active` class is the source of visual truth; the corresponding ARIA
        // attribute follows the class to expose the selection to assistive
        // technologies.
        function applyStateToChips(container, stateKey) {
            const radio = isRadioGroup(container);
            const value = state[stateKey];

            container.querySelectorAll('.chip').forEach(chip => {
                // Only the "View" group has an "All" chip that represents the
                // absence of a filter; in the other groups, an empty value means
                // no chip is active.
                const isActive = value ? chip.dataset.val === value : chip.dataset.val === 'all';
                chip.classList.toggle('active', isActive);

                if (radio) {
                    chip.setAttribute('aria-checked', isActive ? 'true' : 'false');
                    // Only the chosen option enters the tab order.
                    chip.tabIndex = isActive ? 0 : -1;
                } else {
                    chip.setAttribute('aria-pressed', isActive ? 'true' : 'false');
                }
            });
        }

        function selectChip(container, chip, stateKey, toggleable) {
            if (toggleable && chip.classList.contains('active')) {
                // Clicking the already-active item of a toggle group clears the
                // filter.
                state[stateKey] = '';
            } else {
                state[stateKey] = chip.dataset.val;
            }

            applyStateToChips(container, stateKey);
            saveFiltersState();
            render();
        }

        function setupChips(container, stateKey, toggleable) {
            applyStateToChips(container, stateKey);

            container.addEventListener('click', (e) => {
                const chip = e.target.closest('.chip');
                if (!chip) return;
                selectChip(container, chip, stateKey, toggleable);
            });

            if (!isRadioGroup(container)) return;

            // WAI-ARIA radiogroup pattern: the arrows move focus AND change the
            // selection; Home/End go to the ends; navigation wraps around.
            container.addEventListener('keydown', (e) => {
                const chips = [...container.querySelectorAll('.chip')];
                const currentIndex = chips.indexOf(document.activeElement);
                if (currentIndex === -1) return;

                const lastIndex = chips.length - 1;
                let nextIndex;

                switch (e.key) {
                    case 'ArrowRight':
                    case 'ArrowDown':
                        nextIndex = currentIndex === lastIndex ? 0 : currentIndex + 1;
                        break;
                    case 'ArrowLeft':
                    case 'ArrowUp':
                        nextIndex = currentIndex === 0 ? lastIndex : currentIndex - 1;
                        break;
                    case 'Home':
                        nextIndex = 0;
                        break;
                    case 'End':
                        nextIndex = lastIndex;
                        break;
                    default:
                        return;
                }

                e.preventDefault();

                const nextChip = chips[nextIndex];
                selectChip(container, nextChip, stateKey, false);
                nextChip.focus();
            });
        }

        setupChips(viewChipsEl, 'view', false);
        setupChips(baitChipsEl, 'bait', true);
        setupChips(seasonChipsEl, 'season', true);

        // Reorders the two grids in a single pass, without discarding nodes.
        // A fish that moves from "Missing" to "Collected" needs to leave one grid
        // and enter the other: if the source grid removed it before that, the node
        // would leave the document midway (and keyboard focus would be lost
        // along with it). That is why the cleanup removes only what does not
        // belong to EITHER grid, and the relocation happens via a direct
        // insertBefore on the destination grid.
        function syncGrids(groups) {
            const keepAlive = new Set();
            groups.forEach(({ cards }) => cards.forEach(card => keepAlive.add(card)));

            groups.forEach(({ grid }) => {
                Array.from(grid.children).forEach(child => {
                    if (!keepAlive.has(child)) child.remove();
                });
            });

            groups.forEach(({ grid, cards }) => {
                cards.forEach((card, index) => {
                    const current = grid.children[index] || null;
                    if (current !== card) {
                        grid.insertBefore(card, current);
                    }
                });
            });
        }

        // Returns focus to the fish card that was focused. If it left the results
        // (moved to a section hidden by the filter or stopped passing the
        // filters), focus goes to the next available item in the displayed order.
        function restoreCardFocus(previousName, renderedCards, filtered) {
            if (!previousName) return;

            const previousCard = renderedCards.get(previousName);
            if (previousCard) {
                if (document.activeElement !== previousCard) {
                    previousCard.focus({ preventScroll: true });
                }
                return;
            }

            const startIndex = filtered.findIndex(f => f.name === previousName);

            // startIndex === -1 means the focused fish stopped passing the
            // filters: the one who changed the filter was the person, not the
            // card. There is no natural "next item" in this situation, and
            // jumping to the first fish on the list would be an arbitrary jump —
            // so focus is simply not reallocated (whoever acted by keyboard is on
            // the chip they just activated).
            if (startIndex === -1) return;

            let next = null;
            for (let i = startIndex + 1; i < filtered.length && !next; i++) {
                next = renderedCards.get(filtered[i].name) || null;
            }
            for (let i = startIndex - 1; i >= 0 && !next; i--) {
                next = renderedCards.get(filtered[i].name) || null;
            }

            // preventScroll here too: switching items must not drag the screen.
            if (next) {
                next.focus({ preventScroll: true });
                return;
            }

            const emptyState = document.getElementById('emptyState');
            if (emptyState && !emptyState.classList.contains('hidden')) {
                emptyState.focus({ preventScroll: true });
            }
        }

        // 2 & 3. Rendering with a Clear Split Between Total and Local Progress
        function render() {
            const inventory = getInventory();
            const totalFishCount = fishDatabase.length;
            const globalCollectedCount = fishDatabase.filter(f => !!inventory[f.name]).length;

            const missingGrid = document.getElementById('missingGrid');
            const collectedGrid = document.getElementById('collectedGrid');
            const missingContainer = document.getElementById('missingContainer');
            const collectedContainer = document.getElementById('collectedContainer');
            const emptyState = document.getElementById('emptyState');

            // Text search: matches the fish's name or any of the required chums,
            // to find both "Whale Shark" and "chicken". The comparison is by
            // words: each typed term needs to appear somewhere in "name + chums",
            // in any order. That way "mushroom", "wild mushroom" and "mushroom
            // wild" are equivalent and find the Tuna (official chum "Wild
            // Mushroom").
            const query = searchQuery.trim().toLowerCase();
            const queryTokens = query.split(/\s+/).filter(Boolean);
            const matchesQuery = (fish) => {
                if (queryTokens.length === 0) return true;
                const haystack = `${fish.name} ${fish.chums.join(' ')}`.toLowerCase();
                return queryTokens.every(token => haystack.includes(token));
            };

            const filtered = fishDatabase.filter(f => {
                const matchBait = !state.bait || f.baits.includes(state.bait);
                const matchSeason = !state.season || f.seasons.includes(state.season);
                return matchBait && matchSeason && matchesQuery(f);
            });

            // Stores who had focus before touching the DOM, to give it back later.
            const activeElement = document.activeElement;
            const focusedFishName = activeElement && activeElement.classList
                && activeElement.classList.contains('fish-card')
                ? activeElement.dataset.fishName
                : null;

            // Reuses the cards already built, indexed by the fish's name.
            const cardPool = new Map();
            [missingGrid, collectedGrid].forEach(grid => {
                Array.from(grid.children).forEach(card => {
                    if (card.dataset && card.dataset.fishName) {
                        cardPool.set(card.dataset.fishName, card);
                    }
                });
            });

            const desiredMissing = [];
            const desiredCollected = [];
            const renderedCards = new Map();

            let filteredCollectedCount = 0;

            filtered.forEach(fish => {
                const isCollected = !!inventory[fish.name];

                if (isCollected) {
                    filteredCollectedCount++;
                }

                // The view mode can hide the card, but it still counts.
                const isVisible = isCollected ? state.view !== 'missing' : state.view !== 'collected';
                if (!isVisible) return;

                let card = cardPool.get(fish.name);
                if (card) {
                    cardPool.delete(fish.name);
                } else {
                    card = createFishCard(fish, isCollected);
                }

                updateFishCard(card, fish, isCollected);

                if (isCollected) {
                    desiredCollected.push(card);
                } else {
                    desiredMissing.push(card);
                }

                renderedCards.set(fish.name, card);
            });

            // Cards that left the results leave the document.
            cardPool.forEach(card => card.remove());

            syncGrids([
                { grid: missingGrid, cards: desiredMissing },
                { grid: collectedGrid, cards: desiredCollected }
            ]);

            const hasVisibleItems = desiredMissing.length > 0 || desiredCollected.length > 0;

            const emptyMessage = query
                ? `No fish found for "${searchQuery.trim()}".`
                : 'No fish found with the selected filters.';
            if (emptyState.textContent !== emptyMessage) emptyState.textContent = emptyMessage;

            emptyState.classList.toggle('hidden', hasVisibleItems);
            missingContainer.classList.toggle('hidden', desiredMissing.length === 0);
            collectedContainer.classList.toggle('hidden', desiredCollected.length === 0);

            // Updates the bar and the counters
            updateProgressDisplays(globalCollectedCount, totalFishCount, filteredCollectedCount, filtered.length);

            restoreCardFocus(focusedFishName, renderedCards, filtered);
        }

        function updateProgressDisplays(globalCollected, globalTotal, filterCollected, filterTotal) {
            const globalPct = globalTotal === 0 ? 0 : Math.round((globalCollected / globalTotal) * 100);

            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');

            progressFill.style.width = `${globalPct}%`;
            progressBar.setAttribute('aria-valuenow', globalPct);
            document.getElementById('globalProgressCount').textContent = `${globalCollected}/${globalTotal} (${globalPct}%)`;

            // Active filters indicator
            const activeFilters = [];
            if (state.bait) activeFilters.push(`Bait: ${state.bait}`);
            if (state.season) activeFilters.push(`Season: ${state.season}`);
            if (state.view !== 'all') activeFilters.push(`Mode: ${state.view === 'missing' ? 'Missing' : 'Collected'}`);
            if (searchQuery.trim()) activeFilters.push(`Search: "${searchQuery.trim()}"`);

            const filterLabelText = activeFilters.length > 0 ? activeFilters.join(' • ') : 'No filter applied';
            document.getElementById('filterProgressLabel').textContent = filterLabelText;

            const filteredMissing = filterTotal - filterCollected;
            const filterProgressCount = document.getElementById('filterProgressCount');

            if (state.view === 'missing') {
                filterProgressCount.textContent = `In this filter: ${pluralize(filteredMissing, 'missing', 'missing')}`;
            } else if (state.view === 'collected') {
                filterProgressCount.textContent = `In this filter: ${pluralize(filterCollected, 'collected', 'collected')}`;
            } else {
                filterProgressCount.textContent = `In this filter: ${filterCollected}/${filterTotal} ${filterCollected === 1 ? 'collected' : 'collected'}`;
            }
        }

        // 11. Cross-tab sync: a change made in another tab needs to reflect on the
        // cards and counters without requiring local interaction or a reload. The
        // inventory is not the only shared state — theme and filters also live in
        // localStorage and would fall out of sync if only the inventory were
        // observed.
        window.addEventListener('storage', (event) => {
            // event.key === null indicates localStorage.clear() in another tab:
            // theme and filters were erased along with it, so everything is
            // re-read.
            if (event.key === null) {
                if (!hasUnsavedInventory) inventoryCache = readInventoryFromStorage();
                applyCurrentThemePreference();
                applyFilters(readFiltersFromStorage());
                render();
                return;
            }

            if (event.key === STORAGE_KEY) {
                if (hasUnsavedInventory) {
                    // The local write failed before (quota, for instance). Instead
                    // of refusing external updates forever or overwriting them
                    // with the local state, it tries to write again now, merging
                    // the two inventories: since a fish only exists as `true` or
                    // absent, the union preserves both the marks made here and
                    // those made in the tab that just wrote. Known limitation:
                    // the union does not preserve removals — if the other tab
                    // unchecked a fish (or reset the collection) while there was
                    // a pending write here, the union re-checks it; without
                    // per-fish timestamps in storage there is no better way to
                    // decide, and the heuristic favors never losing progress. If
                    // the write still fails, the local state prevails.
                    const external = readInventoryFromStorage();
                    const merged = { ...(inventoryCache || {}), ...external };
                    if (!persistInventory(merged)) return;
                }

                inventoryCache = readInventoryFromStorage();
                render();
                return;
            }

            if (event.key === THEME_KEY) {
                applyCurrentThemePreference();
                return;
            }

            if (event.key === FILTERS_KEY) {
                applyFilters(readFiltersFromStorage());
                render();
            }
        });

        // 12. Instant text search (by fish or by chum)
        const searchInput = document.getElementById('searchInput');
        const searchClear = document.getElementById('searchClear');

        function setSearchQuery(value) {
            searchQuery = value;
            searchClear.hidden = value.length === 0;
            render();
        }

        searchInput.addEventListener('input', () => setSearchQuery(searchInput.value));

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && searchInput.value !== '') {
                e.preventDefault();
                searchInput.value = '';
                setSearchQuery('');
            }
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            setSearchQuery('');
            searchInput.focus();
        });

        // 13. Backup: export, import and reset the collection
        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');
        const resetBtn = document.getElementById('resetBtn');
        const importInput = document.getElementById('importInput');

        const BACKUP_APP_ID = 'fishInventory';

        function exportInventory() {
            const inv = getInventory();
            const payload = {
                app: BACKUP_APP_ID,
                version: 1,
                exportedAt: new Date().toISOString(),
                collected: inv
            };

            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `fishing-progress-${new Date().toISOString().slice(0, 10)}.json`;

            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);

            const count = Object.keys(inv).length;
            showToast(
                `${pluralize(count, 'fish exported', 'fish exported')}.`,
                { duration: TOAST_CONFIRM_DURATION }
            );
        }

        // Accepts both the package generated by this app and a plain map
        // { "Anchovy": true }: the sanitizeInventory discards anything that is not
        // a valid fish.
        function extractInventory(parsed) {
            if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
                // Array.isArray here too: an array would pass the typeof 'object'
                // check and sanitizeInventory would discard it entirely.
                if (parsed.collected && typeof parsed.collected === 'object' && !Array.isArray(parsed.collected)) {
                    return parsed.collected;
                }
                if (parsed.inventory && typeof parsed.inventory === 'object' && !Array.isArray(parsed.inventory)) {
                    return parsed.inventory;
                }
            }
            return parsed;
        }

        function readFileAsText(file) {
            if (typeof file.text === 'function') return file.text();

            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(String(reader.result));
                reader.onerror = () => reject(reader.error);
                reader.readAsText(file);
            });
        }

        function importInventoryFile(file) {
            readFileAsText(file)
                .then((text) => {
                    let parsed;
                    try {
                        parsed = JSON.parse(text);
                    } catch {
                        showToast('Invalid file: the content is not JSON.', { duration: TOAST_CONFIRM_DURATION });
                        return;
                    }

                    const raw = extractInventory(parsed);
                    const clean = sanitizeInventory(raw);
                    const count = Object.keys(clean).length;

                    if (count === 0) {
                        // A backup exported with collected: {} is a valid empty
                        // collection and must be restorable (zeroing the
                        // collection). Without this, it would only be possible to
                        // empty it via "Reset". Distinguished from an invalid
                        // file: zero is only accepted when the
                        // collected/inventory envelope exists and is empty; a
                        // bare empty map or one with only invalid fish stays
                        // rejected.
                        const rawIsEmpty = raw && typeof raw === 'object' && !Array.isArray(raw)
                            && Object.keys(raw).length === 0;
                        const hasEnvelope = parsed && typeof parsed === 'object' && !Array.isArray(parsed)
                            && ((parsed.collected && typeof parsed.collected === 'object' && !Array.isArray(parsed.collected))
                                || (parsed.inventory && typeof parsed.inventory === 'object' && !Array.isArray(parsed.inventory)));
                        if (!(rawIsEmpty && hasEnvelope)) {
                            showToast('No fish recognized in the file.', { duration: TOAST_CONFIRM_DURATION });
                            return;
                        }
                    }

                    const question = count === 0
                        ? 'Import an empty collection? The current collection will be replaced and will have no fish collected.'
                        : `Import ${pluralize(count, 'collected fish', 'collected fish')}? `
                            + 'The current collection will be replaced.';
                    if (!window.confirm(question)) return;

                    const saved = persistInventory(clean);
                    render();
                    showToast(
                        saved
                            ? (count === 0 ? 'Empty collection imported.' : `${pluralize(count, 'fish imported', 'fish imported')}.`)
                            : 'Import applied, but it could not be saved: the change will be lost on page reload.',
                        { duration: TOAST_CONFIRM_DURATION }
                    );
                })
                .catch(() => {
                    showToast('The selected file could not be read.', { duration: TOAST_CONFIRM_DURATION });
                });
        }

        exportBtn.addEventListener('click', exportInventory);

        importBtn.addEventListener('click', () => importInput.click());

        importInput.addEventListener('change', () => {
            const file = importInput.files && importInput.files[0];
            // Clears the value so choosing the same file again fires change.
            importInput.value = '';
            if (file) importInventoryFile(file);
        });

        resetBtn.addEventListener('click', () => {
            if (!window.confirm('Reset the collection? All saved progress will be erased.')) return;

            const saved = persistInventory({});
            render();
            showToast(
                saved
                    ? 'Collection reset.'
                    : 'Collection cleared in this tab, but it could not be saved: the change will be lost on page reload.',
                { duration: TOAST_CONFIRM_DURATION }
            );
        });

        // Initialization
        applyCurrentThemePreference();
        render();
    </script>
</body>
</html>
